# packages.conf - the manifest bootstrap.sh reads

PKG_GROUPS=(shell cli dev infra network creative apps)

GROUP_shell_DESC="Shell, prompt and the tools a login needs"
GROUP_shell_GUI=no
GROUP_shell_APT=(zsh git git-lfs curl wget ca-certificates gnupg apt-transport-https flatpak)
GROUP_shell_FLATPAK=()

GROUP_cli_DESC="Modern CLI bundle - nicer cat, ls, find and grep"
GROUP_cli_GUI=no
# The rest of the modern CLI bundle is in RELEASES. The archive trails upstream
# by years - Ubuntu 24.04's yt-dlp is from April 2024 - and 24.04 has no procs,
# dust or glow at all.
GROUP_cli_APT=(
  7zip
  ffmpeg
  tree
  unzip
  vim
  tmux
  cifs-utils
  exfatprogs
)
GROUP_cli_FLATPAK=()

GROUP_dev_DESC="Runtimes, toolchains and build dependencies"
GROUP_dev_GUI=no
# Node, Go and Java come from mise (`mise use -g node@lts go@latest
# java@temurin-21`), gh from GitHub's own apt repository in REPOS, shellcheck from
# RELEASES: the archive's were years behind - Ubuntu 24.04 ships Node 18, past end
# of life - and bookworm has no openjdk-21-jdk at all, only 17.
GROUP_dev_APT=(
  python3
  python3-pip
  python3-venv
  make
  build-essential
  libssl-dev
  zlib1g-dev
  libbz2-dev
  libreadline-dev
  libsqlite3-dev
  llvm
  libncurses-dev
  xz-utils
  tk-dev
  libffi-dev
  liblzma-dev
)
GROUP_dev_FLATPAK=()

GROUP_infra_DESC="Configuration management and linting"
GROUP_infra_GUI=no
GROUP_infra_APT=()
GROUP_infra_FLATPAK=()
# Python CLIs, each in its own venv through `uv tool`, commands linked into
# ~/.local/bin - installed after the release binaries, which bring uv. The
# archive's lagged badly: Ubuntu 24.04 has ansible-lint 6.17, upstream 26.8.
# "name" or "name|extra arguments for uv tool install".
GROUP_infra_UV=(
  "ansible|--with-executables-from ansible-core"
  ansible-lint
  pre-commit
  yamllint
)

# trippy and gping are release binaries below: Ubuntu 24.04 has no trippy and a
# gping five releases old.
GROUP_network_DESC="Network diagnostics - route, latency and port scans"
GROUP_network_GUI=no
GROUP_network_APT=(
  nmap
)
GROUP_network_FLATPAK=()

GROUP_creative_DESC="3D, 2D and capture tooling"
GROUP_creative_GUI=yes
GROUP_creative_APT=(inkscape obs-studio)
GROUP_creative_FLATPAK=(org.blender.Blender org.gimp.GIMP org.flameshot.Flameshot)

GROUP_apps_DESC="Everyday desktop applications"
GROUP_apps_GUI=yes
# ghostty is in neither archive before Ubuntu 26.04 - see GHOSTTY_DEB_REPO.
# Zoom and Bruno, like Blender above, are x86_64-only on Flathub; on arm64 they
# report missing rather than failed.
GROUP_apps_APT=(vlc mpv qbittorrent evince)
GROUP_apps_FLATPAK=(md.obsidian.Obsidian org.onlyoffice.desktopeditors org.telegram.desktop us.zoom.Zoom com.usebruno.Bruno io.dbeaver.DBeaverCommunity com.bitwarden.desktop)

# pyenv, pyenv-virtualenv and nvm lived here until mise replaced all three.
TOOLS=()

CLAUDE_CODE_ENABLED=yes
CLAUDE_CODE_INSTALLER="https://claude.ai/install.sh"

# Python, Node, Go, Java and the Terraform family from one tool and one
# .mise.toml. Not in the Debian archive, so it comes from the vendor script,
# the same shape as CLAUDE_CODE above; mise updates itself with `mise self-update`.
MISE_ENABLED=yes
MISE_INSTALLER="https://mise.run"

AWSCLI_ENABLED=yes
AWSCLI_URL="https://awscli.amazonaws.com/awscli-exe-linux-{UNAME_ARCH}.zip"
AWSCLI_DIR="${HOME}/.local/aws-cli"

DOTNET_ENABLED=yes
DOTNET_CHANNEL="10.0"
DOTNET_DIR="${HOME}/.dotnet"

ZSH_ENABLED=yes

# Cloned into ~/.local/share/zsh/plugins and sourced by path from the
# fragment. macOS gets the same four from Homebrew.
ZSH_PLUGIN_REPOS=(
  "zsh-syntax-highlighting|https://github.com/zsh-users/zsh-syntax-highlighting.git"
  "zsh-autosuggestions|https://github.com/zsh-users/zsh-autosuggestions.git"
  "zsh-history-substring-search|https://github.com/zsh-users/zsh-history-substring-search.git"
  "zsh-completions|https://github.com/zsh-users/zsh-completions.git"
  "fzf-tab|https://github.com/Aloxaf/fzf-tab.git"
)

RELEASES=(
  tflint terraform_docs helm k9s stern kubecolor yq difftastic starship uv carapace atuin trippy
  bat delta eza fd ripgrep zoxide fzf jq yt_dlp btop procs dust duf glow fx lnav gping shellcheck
  bitwarden_cli sd xh doggo lazygit
)

RELEASE_tflint_REPO="terraform-linters/tflint"
RELEASE_tflint_BIN="tflint"
RELEASE_tflint_ASSET="tflint_linux_{ARCH}.zip"

RELEASE_terraform_docs_REPO="terraform-docs/terraform-docs"
RELEASE_terraform_docs_BIN="terraform-docs"
RELEASE_terraform_docs_ASSET="terraform-docs-{TAG}-linux-{ARCH}.tar.gz"

RELEASE_helm_REPO="helm/helm"
RELEASE_helm_BIN="helm"
RELEASE_helm_URL="https://get.helm.sh/helm-{TAG}-linux-{ARCH}.tar.gz"
RELEASE_helm_ASSET=""

RELEASE_k9s_REPO="derailed/k9s"
RELEASE_k9s_BIN="k9s"
RELEASE_k9s_ASSET="k9s_Linux_{ARCH}.tar.gz"

RELEASE_stern_REPO="stern/stern"
RELEASE_stern_BIN="stern"
RELEASE_stern_ASSET="stern_{VERSION}_linux_{ARCH}.tar.gz"

# Not the apt package: Debian's kubecolor is 0.0.20, from before the
# kubecolor/kubecolor fork.
RELEASE_kubecolor_REPO="kubecolor/kubecolor"
RELEASE_kubecolor_BIN="kubecolor"
RELEASE_kubecolor_ASSET="kubecolor_{VERSION}_linux_{ARCH}.tar.gz"
# Every other argument goes to kubectl, so `kubecolor version` reports
# kubectl's version - and a mismatch reinstalls kubecolor on every run.
RELEASE_kubecolor_VERSION_ARGS="--kubecolor-version"

# goreleaser arch: the assets are lazygit_{VERSION}_linux_x86_64 / _arm64,
# not the amd64 that {ARCH} expands to.
RELEASE_lazygit_REPO="jesseduffield/lazygit"
RELEASE_lazygit_BIN="lazygit"
RELEASE_lazygit_ASSET="lazygit_{VERSION}_linux_{GORELEASER_ARCH}.tar.gz"

RELEASE_yq_REPO="mikefarah/yq"
RELEASE_yq_BIN="yq"
RELEASE_yq_ASSET="yq_linux_{ARCH}"

# Not in the Debian archive. gnu, not musl: upstream builds musl for x86_64
# only - the reverse of starship below.
RELEASE_difftastic_REPO="Wilfred/difftastic"
RELEASE_difftastic_BIN="difft"
RELEASE_difftastic_ASSET="difft-{UNAME_ARCH}-unknown-linux-gnu.tar.gz"

RELEASE_starship_REPO="starship/starship"
RELEASE_starship_BIN="starship"
# musl, not gnu: upstream ships a gnu build for x86_64 only, so the gnu
# name 404s on aarch64. The musl build exists for both.
RELEASE_starship_ASSET="starship-{UNAME_ARCH}-unknown-linux-musl.tar.gz"

# Updated here, not by `uv self update`, which only works on installs made by
# uv's own script.
RELEASE_uv_REPO="astral-sh/uv"
RELEASE_uv_BIN="uv"
RELEASE_uv_BINS="uv uvx"
RELEASE_uv_ASSET="uv-{UNAME_ARCH}-unknown-linux-musl.tar.gz"

RELEASE_carapace_REPO="carapace-sh/carapace-bin"
RELEASE_carapace_BIN="carapace"
RELEASE_carapace_ASSET="carapace-bin_{VERSION}_linux_{ARCH}.tar.gz"

# Not apt: Ubuntu 24.04 does not carry atuin, and trixie's 18.6.1 trails the
# self-hosted sync server (18.22.0) by sixteen releases. musl builds exist for
# both architectures.
RELEASE_atuin_REPO="atuinsh/atuin"
RELEASE_atuin_BIN="atuin"
RELEASE_atuin_ASSET="atuin-{UNAME_ARCH}-unknown-linux-musl.tar.gz"

# Not apt either: absent from Ubuntu 24.04, and trixie's is 0.12.2. The tag has
# no leading v, so {VERSION} and {TAG} are the same string here.
RELEASE_trippy_REPO="fujiapple852/trippy"
RELEASE_trippy_BIN="trip"
RELEASE_trippy_ASSET="trippy-{VERSION}-{UNAME_ARCH}-unknown-linux-musl.tar.gz"

# The modern CLI bundle, plus gping and shellcheck. Ubuntu 24.04 lacks procs,
# dust and glow and trails upstream on the rest by one to three years; trixie is
# closer, never current. musl where upstream builds it for both architectures.

RELEASE_bat_REPO="sharkdp/bat"
RELEASE_bat_BIN="bat"
RELEASE_bat_ASSET="bat-v{VERSION}-{UNAME_ARCH}-unknown-linux-musl.tar.gz"

# gnu: the musl build is x86_64 only. It needs glibc 2.34; bookworm has 2.36.
RELEASE_delta_REPO="dandavison/delta"
RELEASE_delta_BIN="delta"
RELEASE_delta_ASSET="delta-{VERSION}-{UNAME_ARCH}-unknown-linux-gnu.tar.gz"

# gnu: the musl build is x86_64 only.
RELEASE_eza_REPO="eza-community/eza"
RELEASE_eza_BIN="eza"
RELEASE_eza_ASSET="eza_{UNAME_ARCH}-unknown-linux-gnu.tar.gz"

RELEASE_fd_REPO="sharkdp/fd"
RELEASE_fd_BIN="fd"
RELEASE_fd_ASSET="fd-v{VERSION}-{UNAME_ARCH}-unknown-linux-musl.tar.gz"

RELEASE_ripgrep_REPO="BurntSushi/ripgrep"
RELEASE_ripgrep_BIN="rg"
RELEASE_ripgrep_ASSET="ripgrep-{VERSION}-{UNAME_ARCH}-unknown-linux-musl.tar.gz"

RELEASE_zoxide_REPO="ajeetdsouza/zoxide"
RELEASE_zoxide_BIN="zoxide"
RELEASE_zoxide_ASSET="zoxide-{VERSION}-{UNAME_ARCH}-unknown-linux-musl.tar.gz"

RELEASE_fzf_REPO="junegunn/fzf"
RELEASE_fzf_BIN="fzf"
RELEASE_fzf_ASSET="fzf-{VERSION}-linux_{ARCH}.tar.gz"

# The tag is jq-1.8.2, not a bare version; install_release reads the number out.
RELEASE_jq_REPO="jqlang/jq"
RELEASE_jq_BIN="jq"
RELEASE_jq_ASSET="jq-linux-{ARCH}"

# The zipapp: one file for every architecture, run by python3. Upstream's frozen
# builds are yt-dlp_linux and yt-dlp_linux_aarch64, which no placeholder spells.
RELEASE_yt_dlp_REPO="yt-dlp/yt-dlp"
RELEASE_yt_dlp_BIN="yt-dlp"
RELEASE_yt_dlp_ASSET="yt-dlp"

RELEASE_btop_REPO="aristocratos/btop"
RELEASE_btop_BIN="btop"
RELEASE_btop_ASSET="btop-{UNAME_ARCH}-unknown-linux-musl.tar.gz"

RELEASE_procs_REPO="dalance/procs"
RELEASE_procs_BIN="procs"
RELEASE_procs_ASSET="procs-v{VERSION}-{UNAME_ARCH}-linux.zip"

RELEASE_dust_REPO="bootandy/dust"
RELEASE_dust_BIN="dust"
RELEASE_dust_ASSET="dust-v{VERSION}-{UNAME_ARCH}-unknown-linux-musl.tar.gz"

RELEASE_duf_REPO="muesli/duf"
RELEASE_duf_BIN="duf"
RELEASE_duf_ASSET="duf_{VERSION}_linux_{GORELEASER_ARCH}.tar.gz"

RELEASE_glow_REPO="charmbracelet/glow"
RELEASE_glow_BIN="glow"
RELEASE_glow_ASSET="glow_{VERSION}_Linux_{GORELEASER_ARCH}.tar.gz"

# Not in either archive; upstream now ships a bare Linux binary per
# architecture, where before it was Homebrew only. The tag has no leading v.
RELEASE_fx_REPO="antonmedv/fx"
RELEASE_fx_BIN="fx"
RELEASE_fx_ASSET="fx_linux_{ARCH}"

RELEASE_lnav_REPO="tstack/lnav"
RELEASE_lnav_BIN="lnav"
RELEASE_lnav_ASSET="lnav-{VERSION}-linux-musl-{GORELEASER_ARCH}.zip"

# Not in either archive. Literal strings by default, so a path or a version
# number needs no escaping - the case sed makes you fight.
RELEASE_sd_REPO="chmln/sd"
RELEASE_sd_BIN="sd"
RELEASE_sd_ASSET="sd-v{VERSION}-{UNAME_ARCH}-unknown-linux-musl.tar.gz"

# The tarball also carries an `xhs` symlink (xh --https); install_release_bins
# copies files, not links, so the zsh fragment aliases it instead.
RELEASE_xh_REPO="ducaale/xh"
RELEASE_xh_BIN="xh"
RELEASE_xh_ASSET="xh-v{VERSION}-{UNAME_ARCH}-unknown-linux-musl.tar.gz"

# Upstream names the asset by uname's architecture and ships no musl variant;
# the gnu build is static enough for bookworm and 24.04 alike.
RELEASE_doggo_REPO="mr-karan/doggo"
RELEASE_doggo_BIN="doggo"
RELEASE_doggo_ASSET="doggo-linux-{UNAME_ARCH}.tar.gz"

# The tag is gping-v1.21.0; the asset names carry no version.
RELEASE_gping_REPO="orf/gping"
RELEASE_gping_BIN="gping"
RELEASE_gping_ASSET="gping-Linux-musl-{GORELEASER_ARCH}.tar.gz"

RELEASE_shellcheck_REPO="koalaman/shellcheck"
RELEASE_shellcheck_BIN="shellcheck"
RELEASE_shellcheck_ASSET="shellcheck-v{VERSION}.linux.{UNAME_ARCH}.tar.xz"

# Not in either archive. bitwarden/clients releases every Bitwarden app, so its
# "latest" is whichever shipped last; TAG_PREFIX picks the CLI's. The x86_64 zip
# is named without an architecture and the arm64 one with it.
RELEASE_bitwarden_cli_REPO="bitwarden/clients"
RELEASE_bitwarden_cli_TAG_PREFIX="cli-v"
RELEASE_bitwarden_cli_BIN="bw"
RELEASE_bitwarden_cli_ASSET="bw-linux-{VERSION}.zip"
RELEASE_bitwarden_cli_ASSET_arm64="bw-linux-arm64-{VERSION}.zip"

RELEASE_BIN_DIR="${HOME}/.local/bin"

NERD_FONT_ENABLED=yes
NERD_FONT_NAME="Meslo"
NERD_FONT_REPO="ryanoasis/nerd-fonts"
NERD_FONT_MATCH="MesloLGMNerdFont"
NERD_FONT_DIR="${HOME}/.local/share/fonts"

GHOSTTY_ENABLED=yes
# Ghostty is in neither Debian nor Ubuntu before 26.04. ghostty.org's Debian and
# Ubuntu instructions point at this community .deb, one per release,
# architecture and distro version; the matching one is downloaded and handed to
# apt, rather than piping the project's install.sh into bash.
GHOSTTY_DEB_REPO="mkasberg/ghostty-ubuntu"
GHOSTTY_SCROLLBACK_BYTES=268435456

GHOSTTY_THEME="Catppuccin Mocha"

GHOSTTY_FONT_FAMILY="MesloLGM Nerd Font Mono"

GHOSTTY_FONT_SIZE=16

GHOSTTY_COPY_ON_SELECT=clipboard

GHOSTTY_SHELL_INTEGRATION_FEATURES="cursor,sudo,title,ssh-env,ssh-terminfo"

GHOSTTY_QUICK_TERMINAL_KEYBIND="global:ctrl+grave_accent=toggle_quick_terminal"

GHOSTTY_WINDOW_PADDING_X=10
GHOSTTY_WINDOW_PADDING_Y=10

HISTORY_SIZE=1000000
HISTORY_FILE_SIZE=1000000

SCHEDULE_ENABLED=yes
SCHEDULE_UNIT_NAME="bootstrap-linux"

SCHEDULE_TIME="04:20"

HELD=()

REPOS=(vscode docker unityhub kubernetes azurecli gcloud githubcli)

REPO_vscode_DESC="Visual Studio Code"
REPO_vscode_GUI=yes
REPO_vscode_KEY_URL="https://packages.microsoft.com/keys/microsoft.asc"
REPO_vscode_URI="https://packages.microsoft.com/repos/code"
REPO_vscode_SUITES="stable"
REPO_vscode_COMPONENTS="main"
REPO_vscode_PACKAGES=(code)

REPO_docker_DESC="Docker Engine"
REPO_docker_GUI=no
REPO_docker_KEY_URL="https://download.docker.com/linux/{ID}/gpg"
REPO_docker_URI="https://download.docker.com/linux/{ID}"
REPO_docker_SUITES="{CODENAME}"
REPO_docker_COMPONENTS="stable"
REPO_docker_PACKAGES=(docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin)

REPO_unityhub_DESC="Unity Hub"
REPO_unityhub_GUI=yes
REPO_unityhub_KEY_URL="https://hub.unity3d.com/linux/keys/public"
REPO_unityhub_URI="https://hub.unity3d.com/linux/repos/deb"
REPO_unityhub_SUITES="stable"
REPO_unityhub_COMPONENTS="main"
REPO_unityhub_PACKAGES=(unityhub)

REPO_kubernetes_DESC="kubectl"
REPO_kubernetes_GUI=no
REPO_kubernetes_KEY_URL="https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key"
REPO_kubernetes_URI="https://pkgs.k8s.io/core:/stable:/v1.37/deb/"
REPO_kubernetes_SUITES="/"
REPO_kubernetes_COMPONENTS=""
REPO_kubernetes_PACKAGES=(kubectl)

REPO_azurecli_DESC="Azure CLI"
REPO_azurecli_GUI=no
REPO_azurecli_KEY_URL="https://packages.microsoft.com/keys/microsoft.asc"
REPO_azurecli_URI="https://packages.microsoft.com/repos/azure-cli/"
REPO_azurecli_SUITES="{CODENAME}"
REPO_azurecli_COMPONENTS="main"
REPO_azurecli_PACKAGES=(azure-cli)
# No trixie suite on packages.microsoft.com yet (404 on its Release file).
# Microsoft's guidance for an unlisted release is the closest one it publishes.
# Drop the entry once dists/trixie exists.
REPO_azurecli_CODENAME_MAP=(trixie:bookworm)

REPO_gcloud_DESC="Google Cloud CLI"
REPO_gcloud_GUI=no
REPO_gcloud_KEY_URL="https://packages.cloud.google.com/apt/doc/apt-key.gpg"
REPO_gcloud_URI="https://packages.cloud.google.com/apt"
REPO_gcloud_SUITES="cloud-sdk"
REPO_gcloud_COMPONENTS="main"
REPO_gcloud_PACKAGES=(google-cloud-cli)

MANUAL=()

# GitHub's own repository: the archive's gh was 2.45 on Ubuntu 24.04 and 2.46 on
# trixie against 2.100 upstream. The key is a binary keyring, not armoured.
REPO_githubcli_DESC="GitHub CLI"
REPO_githubcli_GUI=no
REPO_githubcli_KEY_URL="https://cli.github.com/packages/githubcli-archive-keyring.gpg"
REPO_githubcli_URI="https://cli.github.com/packages"
REPO_githubcli_SUITES="stable"
REPO_githubcli_COMPONENTS="main"
REPO_githubcli_PACKAGES=(gh)

# VS Code extensions - curated from `code --list-extensions` on the Windows
# machine, minus duplicates (docker.docker over the two ms-azuretools
# Docker/Container Tools extensions, GitLens over donjayamanne.githistory,
# hashicorp.terraform already bundles HCL, the python extension pack over its
# loose parts). Install-only: bootstrap.sh never uninstalls one that isn't
# listed here.
VSCODE_EXTENSIONS=(
  aaron-bond.better-comments
  anthropic.claude-code
  christian-kohler.path-intellisense
  codezombiech.gitignore
  davidanson.vscode-markdownlint
  docker.docker
  eamodio.gitlens
  github.vscode-pull-request-github
  golang.go
  hashicorp.terraform
  ms-azuretools.vscode-azureterraform
  ms-dotnettools.csdevkit
  ms-dotnettools.csharp
  ms-dotnettools.vscode-dotnet-runtime
  ms-kubernetes-tools.vscode-kubernetes-tools
  ms-python.debugpy
  ms-python.python
  ms-python.vscode-pylance
  ms-vscode-remote.remote-containers
  ms-vscode-remote.remote-ssh
  ms-vscode-remote.remote-ssh-edit
  ms-vscode-remote.remote-wsl
  ms-vscode-remote.vscode-remote-extensionpack
  ms-vscode.powershell
  ms-vscode.remote-explorer
  ms-vscode.remote-server
  redhat.vscode-commons
  redhat.vscode-yaml
  visualstudiotoolsforunity.vstuc
  vscode-icons-team.vscode-icons
  yzhang.markdown-all-in-one
)
