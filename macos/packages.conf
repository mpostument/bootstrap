# packages.conf - the manifest bootstrap.sh reads

PKG_GROUPS=(shell cli dev infra network cloud apps)

GROUP_shell_DESC="Shell, prompt and the tools a login needs"
GROUP_shell_GUI=no
GROUP_shell_FORMULA=(
  git
  git-lfs
  wget
  gnupg
  coreutils
  starship
  atuin
  carapace
  zsh-autosuggestions
  zsh-completions
  zsh-syntax-highlighting
  zsh-history-substring-search
  fzf-tab
)
GROUP_shell_CASK=(font-meslo-lg-nerd-font)

GROUP_cli_DESC="Modern CLI bundle - nicer cat, ls, find and grep"
GROUP_cli_GUI=no
GROUP_cli_FORMULA=(
  bat
  eza
  git-delta
  difftastic
  fd
  ripgrep
  zoxide
  fzf
  jq
  yq
  sevenzip
  yt-dlp
  ffmpeg
  btop
  tree
  vim
  tmux
  procs
  dust
  duf
  glow
  fx
  lnav
  sd
  xh
  doggo
  lazygit
  lazydocker
  tealdeer
)
GROUP_cli_CASK=()

GROUP_dev_DESC="Runtimes, toolchains and build dependencies"
GROUP_dev_GUI=no
# node, go and java are not here: they come from mise/tools.conf at the repo
# root, the one list all three platforms share. python3 stays, because
# Homebrew packages link against it.
GROUP_dev_FORMULA=(
  python3
  gh
  docker
  docker-compose
  shellcheck
  make
  mise
  uv
  openssl@3
  readline
  sqlite3
  xz
  zlib
  tcl-tk
  libffi
)
GROUP_dev_CASK=(claude-code dotnet-sdk jetbrains-toolbox)

GROUP_infra_DESC="Configuration management and linting"
GROUP_infra_GUI=no
GROUP_infra_FORMULA=(
  ansible-lint
  yamllint
  pre-commit
  tflint
  terraform-docs
)
GROUP_infra_CASK=()

GROUP_network_DESC="Network diagnostics - route, latency and port scans"
GROUP_network_GUI=no
GROUP_network_FORMULA=(
  trippy
  gping
  nmap
)
GROUP_network_CASK=()

GROUP_cloud_DESC="Cloud and Kubernetes CLIs"
GROUP_cloud_GUI=no
GROUP_cloud_FORMULA=(
  kubernetes-cli
  kubecolor
  helm
  k9s
  stern
  awscli
  azure-cli
)
GROUP_cloud_CASK=(gcloud-cli)

GROUP_apps_DESC="Everyday desktop applications"
GROUP_apps_GUI=yes
GROUP_apps_FORMULA=()
GROUP_apps_CASK=(
  ghostty
  visual-studio-code
  vlc
  obsidian
  onlyoffice
  bruno
  dbeaver-community
)

TOOLS=()

ZSH_ENABLED=yes

GHOSTTY_ENABLED=yes
GHOSTTY_SCROLLBACK_BYTES=268435456

GHOSTTY_THEME="Catppuccin Mocha"

GHOSTTY_FONT_FAMILY="MesloLGM Nerd Font Mono"

GHOSTTY_FONT_SIZE=16

GHOSTTY_MACOS_OPTION_AS_ALT=true

GHOSTTY_WINDOW_SAVE_STATE=always

GHOSTTY_COPY_ON_SELECT=clipboard

GHOSTTY_QUIT_AFTER_LAST_WINDOW=true

GHOSTTY_SHELL_INTEGRATION_FEATURES="cursor,sudo,title,ssh-env,ssh-terminfo"

GHOSTTY_QUICK_TERMINAL_KEYBIND="global:cmd+grave_accent=toggle_quick_terminal"

GHOSTTY_WINDOW_PADDING_X=10
GHOSTTY_WINDOW_PADDING_Y=10

HISTORY_SIZE=1000000
HISTORY_FILE_SIZE=1000000

# Housekeeping. `brew cleanup --prune=N` removes versions nothing links to any
# more and cache entries older than N days - nothing that is in use, and
# nothing a reinstall could not fetch again.
BREW_CLEANUP_ENABLED=yes
BREW_CLEANUP_PRUNE_DAYS=30

# The daily unattended run: a launchd user agent, the counterpart of
# SCHEDULE_* in linux/packages.conf and the Schedule block in
# windows/packages.psd1. The label is also the plist's file name, in
# ~/Library/LaunchAgents.
SCHEDULE_ENABLED=yes
SCHEDULE_LABEL="com.github.bootstrap.macos"

SCHEDULE_TIME="04:20"

SCHEDULE_LOG_DIR="${HOME}/Library/Logs/bootstrap-macos"
SCHEDULE_KEEP_LOG_DAYS=30

# A failed unattended run posts one Notification Center banner. Only unattended
# runs: an interactive one has already printed the failures in red.
SCHEDULE_NOTIFY_ON_FAILURE=yes

# Hands-off in both directions, the macOS counterpart of the `Managed` section
# in windows/packages.psd1: software another installer owns, listed here so the
# omission is a decision on the record rather than an oversight.
HELD=(
  "rider:installed and self-updated by JetBrains Toolbox - the rider cask would fight it"
  "datagrip:same Toolbox instance as Rider"
)

TAPS=(
  "terraform-linters/tap:tflint - not in homebrew-core, and the infra group needs it"
)

MANUAL=()

# VS Code extensions - curated from `code --list-extensions` on the Windows
# machine, minus duplicates (docker.docker over the two ms-azuretools
# Docker/Container Tools extensions, GitLens over donjayamanne.githistory,
# hashicorp.terraform already bundles HCL, the python extension pack over its
# loose parts). Install-only: bootstrap.sh never uninstalls one that isn't
# listed here.
VSCODE_EXTENSIONS=(
  aaron-bond.better-comments
  anthropic.claude-code
  christian-kohler.path-intellisense
  codezombiech.gitignore
  davidanson.vscode-markdownlint
  docker.docker
  eamodio.gitlens
  github.vscode-pull-request-github
  golang.go
  hashicorp.terraform
  ms-azuretools.vscode-azureterraform
  ms-dotnettools.csdevkit
  ms-dotnettools.csharp
  ms-dotnettools.vscode-dotnet-runtime
  ms-kubernetes-tools.vscode-kubernetes-tools
  ms-python.debugpy
  ms-python.python
  ms-python.vscode-pylance
  ms-vscode-remote.remote-containers
  ms-vscode-remote.remote-ssh
  ms-vscode-remote.remote-ssh-edit
  ms-vscode-remote.remote-wsl
  ms-vscode-remote.vscode-remote-extensionpack
  ms-vscode.powershell
  ms-vscode.remote-explorer
  ms-vscode.remote-server
  redhat.vscode-commons
  redhat.vscode-yaml
  visualstudiotoolsforunity.vstuc
  vscode-icons-team.vscode-icons
  yzhang.markdown-all-in-one
)
