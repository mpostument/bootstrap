name: Release Linux bootstrap

# Each platform in this repository releases on its own, so the tag carries a
# platform prefix - linux-vX.Y.Z rather than a bare vX.Y.Z, which would imply
# the whole repository had been cut at once.
#
# To publish:
#   1. bump BOOTSTRAP_VERSION in linux/bootstrap.sh
#   2. add the matching section to linux/CHANGELOG.md
#   3. commit, then: git tag linux-v1.2.3 && git push origin linux-v1.2.3
#
# All three are checked below before anything is published, so a half-done
# release fails the job instead of shipping.
on:
  push:
    tags:
      - "linux-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The tag is the request; bootstrap.sh is the source of truth. If they
      # disagree, someone tagged without bumping (or bumped without tagging),
      # and a downloaded copy would report a version that does not match the
      # release it came from. Fail rather than publish that.
      - name: Check the tag matches the version in the script
        id: version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#linux-v}"
          FILE_VERSION="$(grep -m1 "^BOOTSTRAP_VERSION=" linux/bootstrap.sh | cut -d"'" -f2)"

          if [ -z "$FILE_VERSION" ]; then
            echo "::error::Could not find BOOTSTRAP_VERSION in linux/bootstrap.sh."
            echo "::error::The release workflow parses that exact line - check its shape."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag says $TAG_VERSION, linux/bootstrap.sh says $FILE_VERSION."
            exit 1
          fi
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "OK   tag and script agree on $FILE_VERSION"

      # Release notes come from the changelog, so an entry is not optional. A
      # release published with empty notes is a release nobody can read later.
      - name: Extract the release notes for this version
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                    { print }
          ' linux/CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No '## [$VERSION]' section in linux/CHANGELOG.md."
            exit 1
          fi
          echo "OK   release notes: $(wc -l < release-notes.md) lines"

      # Cannot run the script here - it installs software and wants a Debian
      # host it is allowed to change - but it does mean a script with a syntax
      # error can never reach a release asset.
      - name: Validate the shell that is about to ship
        run: |
          set -euo pipefail
          failed=0
          for f in linux/*.sh; do
            if bash -n "$f"; then
              echo "OK   $f"
            else
              echo "::error file=$f::bash -n failed"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      - name: Shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # The manifest is sourced, not executed, so shellcheck is told where
          # it comes from rather than guessing.
          shellcheck --external-sources --source-path=linux linux/bootstrap.sh

      # Sourcing proves the manifest parses; the key check is that every
      # section the script reads actually exists. A manifest that sources
      # cleanly but is missing a section fails much later, at runtime, with an
      # unbound-variable error that names the consuming line and not the file.
      - name: Validate the manifest
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . linux/packages.conf
          for required in PKG_GROUPS MANUAL HELD TOOLS REPOS ZSH_PLUGINS ZSH_CUSTOM_PLUGINS; do
            if ! declare -p "$required" >/dev/null 2>&1; then
              echo "::error file=linux/packages.conf::missing \$$required"
              exit 1
            fi
          done
          total=0
          for g in "${PKG_GROUPS[@]}"; do
            declare -n _apt="GROUP_${g}_APT"
            declare -n _flat="GROUP_${g}_FLATPAK"
            total=$(( total + ${#_apt[@]} + ${#_flat[@]} ))
            unset -n _apt _flat
          done
          echo "OK   packages.conf - ${#PKG_GROUPS[@]} groups, $total packages, ${#REPOS[@]} repositories"
        shell: bash

      # Proves the script can actually start, not merely parse. --version
      # returns before anything that touches the system, so it is safe on a
      # runner we do not want modified.
      - name: Check the script can be launched
        run: |
          set -euo pipefail
          ACTUAL="$(bash linux/bootstrap.sh --version | tr -d '[:space:]')"
          EXPECTED="${{ steps.version.outputs.version }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::bootstrap.sh --version printed '$ACTUAL', expected '$EXPECTED'."
            exit 1
          fi
          echo "OK   bootstrap.sh --version -> $ACTUAL"

      - name: Build the release archive
        id: archive
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="bootstrap-linux-v$VERSION"

          mkdir -p "$STAGE"
          # linux/ only. A release asset should carry what you need to run the
          # thing and nothing else, so someone unpacking it on a fresh machine
          # is not handed another platform's files to wonder about.
          cp linux/bootstrap.sh \
             linux/packages.conf \
             linux/README.md \
             linux/CHANGELOG.md \
             "$STAGE/"
          chmod +x "$STAGE/bootstrap.sh"

          tar -czf "$STAGE.tar.gz" "$STAGE"
          sha256sum "$STAGE.tar.gz" | tee "$STAGE.tar.gz.sha256"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE="${{ steps.archive.outputs.stage }}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Linux bootstrap v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            "$STAGE.tar.gz" \
            "$STAGE.tar.gz.sha256"
