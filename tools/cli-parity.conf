# ============================================================
# cli-parity.conf - what "the same bundle on all three" actually means
# ============================================================
# All three manifests claim, in prose, that the `cli` group is deliberately
# identical so muscle memory transfers between the shells. Prose cannot rot
# loudly: `yq` sat in the Linux group for months resolving to a DIFFERENT
# PROGRAM from the one the other two installed, and nothing said a word,
# because a wrong name that installs cleanly looks exactly like a right one.
#
# This file is that claim written down so parity.sh can check it. One row per
# tool, naming what the tool is called on each platform - because the same
# program has three names and comparing the manifests directly would report
# every single line as a difference.
#
# Fields, separated by `|` and trimmed:
#
#   canonical | linux | macos | windows | note | cmd | desc
#
# A cell holds the package name on that platform, or one of:
#
#   -          deliberately absent. The note MUST say why. This is the whole
#              point of the file: a divergence somebody chose is fine, and a
#              divergence nobody noticed is the bug.
#   @releases  present on Linux, but as a RELEASES static binary rather than an
#              apt package. Still parity - the command exists and behaves the
#              same - just owned by a different phase.
#
# Adding a tool to one platform and not the others is allowed. Adding it
# without a row here is not: parity.sh fails on any manifest entry it cannot
# find, so the choice has to be written down rather than merely made.
#
# `cmd` and `desc` are NOT read by parity.sh - it only checks the first four
# fields. They exist for the `tools` shell command (and -ListPackages/
# --list-packages) to show what to actually type and what the thing does,
# not just the install-time package id, which on Windows in particular is
# almost never the same string (`sharkdp.bat` installs, `bat` runs). One
# shared `cmd` column, not per-platform: the rare case where the binary name
# itself differs by platform (7zip) is spelled out in the text instead of
# adding three more columns for one row.

bat        | bat         | bat       | sharkdp.bat             |                                                                                     | bat        | cat with syntax highlighting and line numbers
eza        | eza         | eza       | eza-community.eza       | not in bookworm's archive; reported `missing` there                                | eza        | ls with icons, git status and colour
fd         | fd-find     | fd        | sharkdp.fd              | Debian renames the binary to fdfind; the zsh fragment aliases it                   | fd         | fast, friendlier find
ripgrep    | ripgrep     | ripgrep   | BurntSushi.ripgrep.MSVC |                                                                                     | rg         | fast recursive grep
zoxide     | zoxide      | zoxide    | ajeetdsouza.zoxide      |                                                                                     | z          | cd that learns your most-used directories (raw binary: zoxide)
fzf        | fzf         | fzf       | junegunn.fzf            |                                                                                     | fzf        | fuzzy finder for anything piped into it
jq         | jq          | jq        | jqlang.jq               |                                                                                     | jq         | JSON query/filter language
yq         | @releases   | yq       | MikeFarah.yq             | Debian's `yq` is kislyuk's jq wrapper, a different program - taken as a release binary instead | yq | the Go program by mikefarah - YAML/JSON/XML query, same syntax as jq
7zip       | 7zip        | sevenzip  | 7zip.7zip               | p7zip is unmaintained upstream; 7zip/sevenzip are its successor on each archive    | 7z (macOS: 7zz; Windows: not on PATH by default - see the 7-Zip installer note) | archiver, reads/writes 7z/zip/etc
yt-dlp     | yt-dlp      | yt-dlp    | yt-dlp.yt-dlp           |                                                                                     | yt-dlp     | download video/audio from YouTube and ~1800 other sites
ffmpeg     | ffmpeg      | ffmpeg    | yt-dlp.FFmpeg           | winget has no standalone ffmpeg worth pinning; the yt-dlp build is the one that gets updated | ffmpeg | convert/transcode audio and video
procs      | procs       | procs     | dalance.procs           |                                                                                     | procs      | colourised ps replacement, docker-aware
dust       | du-dust     | dust      | bootandy.dust           |                                                                                     | dust       | du replacement, shows the biggest directories first
duf        | duf         | duf       | muesli.duf              |                                                                                     | duf        | df replacement, colourised disk usage table
glow       | glow        | glow      | charmbracelet.glow      |                                                                                     | glow       | renders markdown in the terminal
fx         | -           | fx        | -                       | JSON TUI viewer/processor; no winget package, not in the Debian archive - Homebrew only for now | fx | interactive JSON viewer/processor
lnav       | lnav        | lnav      | tstack.lnav             |                                                                                     | lnav       | log file navigator, auto-detects format and timestamps
btop       | btop        | btop      | -                       | btop4win exists but is a separate, less-maintained port                            | btop       | resource monitor - cpu/mem/disk/net/process list
tree       | tree        | tree      | -                       | Windows ships tree.com in the base system                                          | tree       | recursive directory listing as a tree
vim        | vim         | vim       | -                       | GAP, not a decision - vim.vim is in winget and should be added                     | vim        | the editor
tmux       | tmux        | tmux      | -                       | no Windows analogue; Windows Terminal panes are the equivalent                     | tmux       | terminal multiplexer - panes and sessions that survive a disconnect
unzip      | unzip       | -         | -                       | in the base system on macOS; 7zip covers it on Windows                             | unzip      | extract .zip archives
cifs-utils | cifs-utils  | -         | -                       | Linux-only; macOS mounts SMB in Finder and with mount_smbfs                        | mount -t cifs | SMB/CIFS network share mounting support (not a command of its own)
exfatprogs | exfatprogs  | -         | -                       | Linux-only; kernel support is built in on macOS and Windows                        | mkfs.exfat / fsck.exfat | exFAT filesystem tools - format/check exFAT drives
