name: Release

# One release for the whole repository, carrying all three platforms.
#
# The platforms still version INDEPENDENTLY - windows/bootstrap.ps1,
# linux/bootstrap.sh and macos/bootstrap.sh each hold their own number and each
# have their own CHANGELOG.md - because a Linux fix is not a reason to renumber
# Windows. What the tag names is the BUNDLE: a point in time at which these
# three particular versions were published together.
#
# So the tag deliberately carries no version of its own to disagree with. Name
# it however you like the bundle described - v2026.02, v3, v2026-02-14 - and
# the release notes state which version of each platform is inside.
#
# To publish:
#   1. bump the version in whichever platform(s) changed
#   2. add the matching section to that platform's CHANGELOG.md
#   3. commit, then: git tag v2026.02 && git push origin v2026.02
#
# Every platform is validated before anything is published, so a broken script
# in one of them fails the job rather than shipping alongside two good ones.
#
# This is one job rather than four. Every check below runs on the same Ubuntu
# runner in seconds - pwsh is preinstalled, and nothing here executes the
# scripts against a real winget, apt or Homebrew - so splitting it up would buy
# parallelism worth less than the artifact plumbing needed to pass three
# staging directories to a fourth job.
on:
  push:
    tags:
      # Bundle tags only. The old per-platform tags began with a platform name
      # - windows-v1.5.0 - so they do not match this and no longer publish
      # anything. The releases they already cut are untouched.
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Each script is the source of truth for its own version. Nothing is
      # compared against the tag any more - the tag names the bundle, not a
      # version - so the check that matters is that every version was actually
      # written down somewhere a reader can find later.
      - name: Read each platform's version
        id: versions
        run: |
          set -euo pipefail
          WINDOWS="$(grep -m1 '^\$script:BootstrapVersion' windows/bootstrap.ps1 | cut -d"'" -f2)"
          LINUX="$(grep -m1 '^BOOTSTRAP_VERSION=' linux/bootstrap.sh | cut -d"'" -f2)"
          MACOS="$(grep -m1 '^BOOTSTRAP_VERSION=' macos/bootstrap.sh | cut -d"'" -f2)"

          failed=0
          for pair in "windows:$WINDOWS" "linux:$LINUX" "macos:$MACOS"; do
            name="${pair%%:*}"; version="${pair#*:}"
            if [ -z "$version" ]; then
              echo "::error::Could not read a version out of the $name script."
              echo "::error::The release workflow parses one exact line - check its shape."
              failed=1
            else
              echo "OK   $name $version"
            fi
          done
          [ "$failed" -eq 0 ]

          {
            echo "windows=$WINDOWS"
            echo "linux=$LINUX"
            echo "macos=$MACOS"
          } >> "$GITHUB_OUTPUT"

      # Release notes are assembled from the three changelogs, so an entry is
      # not optional for any platform - including the ones that did not change
      # in this bundle, whose current section is simply carried in again. A
      # release published with a platform missing from its notes is a release
      # nobody can read later.
      - name: Assemble the release notes
        run: |
          set -euo pipefail
          : > release-notes.md

          # An exact string comparison, NOT a regex, and that is a fix rather
          # than a style preference. The first draft matched with
          # `$0 ~ "^## \\[" v "\\]"`, which looks right and cannot work: awk
          # resolves the string literal to `\[` and then reads that as a
          # dynamic regex, where gawk warns and treats the escape as a plain
          # `[`. The pattern becomes `^## [1.2.0]` - a CHARACTER CLASS - so it
          # matches `## ` followed by one of `1.2.0` and never matches the
          # literal `## [1.2.0]` it was written for.
          #
          # Every platform's notes came back empty, and the job failed at the
          # emptiness check below rather than at the cause. A version heading
          # is one exact line, so compare it as one and let no regex near it.
          extract() {
            local dir="$1" label="$2" version="$3"
            awk -v v="$version" '
              $0 == "## [" v "]" { found = 1; next }
              found && index($0, "## [") == 1 { exit }
              found              { print }
            ' "$dir/CHANGELOG.md"
          }

          failed=0
          for entry in \
            "windows:Windows:${{ steps.versions.outputs.windows }}" \
            "linux:Linux:${{ steps.versions.outputs.linux }}" \
            "macos:macOS:${{ steps.versions.outputs.macos }}"
          do
            dir="${entry%%:*}"; rest="${entry#*:}"
            label="${rest%%:*}"; version="${rest#*:}"

            body="$(extract "$dir" "$label" "$version")"
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              echo "::error file=$dir/CHANGELOG.md::No '## [$version]' section, but $dir says it is version $version."
              failed=1
              continue
            fi
            {
              printf '# %s %s\n\n' "$label" "$version"
              printf '%s\n\n' "$body"
            } >> release-notes.md
          done
          [ "$failed" -eq 0 ]

          echo "OK   release notes: $(wc -l < release-notes.md) lines"

      # ------------------------------------------------------------------
      # Windows
      # ------------------------------------------------------------------

      # pwsh is preinstalled on the Ubuntu runners, so the released scripts can
      # be parsed before they are published. This is not a substitute for
      # running them - that needs Windows and winget - but it does mean a file
      # with a syntax error can never reach a release asset.
      - name: Validate the PowerShell that is about to ship
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem windows/*.ps1) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$errors)
              if ($errors.Count) {
                  $failed = $true
                  foreach ($e in $errors) {
                      Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                  }
              } else {
                  Write-Host "OK   $($file.Name)"
              }
          }
          # Import-PowerShellDataFile evaluates nothing, so this proves the
          # manifest parses without running anything out of it.
          $m = Import-PowerShellDataFile windows/packages.psd1
          # Parsing is not completeness. Drop a whole top-level section and the
          # import still succeeds - 1.3.0 shipped without Shell exactly that
          # way, and the failure surfaced at runtime as a StrictMode property
          # error naming the consuming line rather than the manifest.
          $required = @('Groups', 'Pins', 'Managed', 'Shell', 'Mpv', 'Schedule', 'Git')
          $absent = @($required | Where-Object { -not $m.Contains($_) })
          if ($absent.Count) {
              $failed = $true
              Write-Host "::error file=windows/packages.psd1::Missing section(s): $($absent -join ', ')"
          }
          $count = ($m.Groups | ForEach-Object { $_.Packages.Count } | Measure-Object -Sum).Sum
          Write-Host "OK   packages.psd1 - $($m.Groups.Count) groups, $count packages, sections: $(@($m.Keys) -join ', ')"
          if ($failed) { exit 1 }

      # 1.0.2 shipped with `$script:Root` holding the tool's own directory and,
      # 300 lines later, `foreach ($root in $uninstallRoots)`. Those are the
      # SAME variable - PowerShell names are case-insensitive and an unscoped
      # assignment writes to the enclosing scope - so an unrelated loop pointed
      # the tool at a registry hive and the run died complaining about an
      # unrelated parameter on an unrelated line.
      #
      # Nothing catches that by reading: it parses, and both halves look
      # correct in isolation. So check it mechanically instead.
      - name: Check no loop variable shadows a script-scoped variable
        shell: pwsh
        run: |
          $bad = $false
          foreach ($file in Get-ChildItem windows/*.ps1) {
              $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$null)

              $scoped = $ast.FindAll({
                      param($n)
                      $n -is [System.Management.Automation.Language.VariableExpressionAst] -and
                      $n.VariablePath.IsScript
                  }, $true) |
                  ForEach-Object { $_.VariablePath.UserPath -replace '^(?i)script:', '' } |
                  Sort-Object -Unique

              $ast.FindAll({
                      param($n)
                      $n -is [System.Management.Automation.Language.ForEachStatementAst]
                  }, $true) | ForEach-Object {
                  $name = $_.Variable.VariablePath.UserPath
                  if ($scoped -contains $name) {
                      $bad = $true
                      Write-Host "::error file=$($file.FullName),line=$($_.Extent.StartLineNumber)::foreach variable `$$name shadows script-scoped `$script:$name - rename one of them"
                  }
              }
          }
          if ($bad) { exit 1 }
          Write-Host 'OK   no loop variable shadows a script-scoped variable'

      # Parsing is not enough: 1.0.1 parsed perfectly and still could not start.
      # $PSScriptRoot is empty while parameter defaults are evaluated when an
      # advanced script is launched with `-File`, so the script threw before its
      # first line - and only under `-File`, which is the invocation the README
      # recommends for a downloaded copy but nothing here had ever exercised.
      #
      # -ShowVersion returns before any Windows-only code, so this runs on the
      # Linux runner and still proves the script can actually START.
      - name: Check the Windows script can be launched with -File
        run: |
          set -euo pipefail
          ACTUAL="$(pwsh -File windows/bootstrap.ps1 -ShowVersion | tr -d '[:space:]')"
          EXPECTED="${{ steps.versions.outputs.windows }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::pwsh -File bootstrap.ps1 -ShowVersion printed '$ACTUAL', expected '$EXPECTED'."
            exit 1
          fi
          echo "OK   pwsh -File bootstrap.ps1 -ShowVersion -> $ACTUAL"

      # ------------------------------------------------------------------
      # Linux and macOS
      # ------------------------------------------------------------------

      - name: Validate the shell that is about to ship
        run: |
          set -euo pipefail
          failed=0
          for f in linux/*.sh macos/*.sh; do
            if bash -n "$f"; then
              echo "OK   $f"
            else
              echo "::error file=$f::bash -n failed"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      - name: Shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # Each manifest is sourced, not executed, so shellcheck is told where
          # it comes from rather than guessing.
          shellcheck --external-sources --source-path=linux linux/bootstrap.sh
          shellcheck --external-sources --source-path=macos macos/bootstrap.sh

      # Sourcing proves a manifest parses; the key check is that every section
      # the script reads actually exists. A manifest that sources cleanly but is
      # missing a section fails much later, at runtime, with an unbound-variable
      # error that names the consuming line and not the file.
      - name: Validate the Linux manifest
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . linux/packages.conf
          for required in PKG_GROUPS MANUAL HELD TOOLS REPOS RELEASES ZSH_PLUGINS ZSH_CUSTOM_PLUGINS \
                          DOTNET_ENABLED ZSH_ENABLED NERD_FONT_ENABLED CLAUDE_CODE_ENABLED; do
            if ! declare -p "$required" >/dev/null 2>&1; then
              echo "::error file=linux/packages.conf::missing \$$required"
              exit 1
            fi
          done
          total=0
          for g in "${PKG_GROUPS[@]}"; do
            declare -n _apt="GROUP_${g}_APT"
            declare -n _flat="GROUP_${g}_FLATPAK"
            total=$(( total + ${#_apt[@]} + ${#_flat[@]} ))
            unset -n _apt _flat
          done
          echo "OK   linux/packages.conf - ${#PKG_GROUPS[@]} groups, $total packages, ${#REPOS[@]} repositories"

      - name: Validate the macOS manifest
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . macos/packages.conf
          for required in PKG_GROUPS MANUAL HELD TOOLS TAPS ZSH_PLUGINS ZSH_CUSTOM_PLUGINS \
                          ZSH_ENABLED; do
            if ! declare -p "$required" >/dev/null 2>&1; then
              echo "::error file=macos/packages.conf::missing \$$required"
              exit 1
            fi
          done
          total=0
          for g in "${PKG_GROUPS[@]}"; do
            declare -n _form="GROUP_${g}_FORMULA"
            declare -n _cask="GROUP_${g}_CASK"
            total=$(( total + ${#_form[@]} + ${#_cask[@]} ))
            unset -n _form _cask
          done
          echo "OK   macos/packages.conf - ${#PKG_GROUPS[@]} groups, $total packages, ${#TAPS[@]} taps"

      # A macOS group whose GUI flag gates a mix of desktop apps and headless
      # tools is a trap: --no-gui skips the GROUP, so one cask in with ansible
      # takes ansible down on a build agent. Nothing catches that by reading -
      # the manifest parses and every line looks right on its own.
      - name: Check no macOS GUI group carries headless-only software
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . macos/packages.conf
          bad=0
          for g in "${PKG_GROUPS[@]}"; do
            gui_var="GROUP_${g}_GUI"
            declare -n _form="GROUP_${g}_FORMULA"
            if [ "${!gui_var:-no}" = "yes" ] && [ "${#_form[@]}" -gt 0 ]; then
              echo "::error file=macos/packages.conf::group '$g' is GUI=yes but lists ${#_form[@]} formula(e) - --no-gui would skip those too"
              bad=1
            fi
            unset -n _form
          done
          [ "$bad" -eq 0 ]
          echo 'OK   every macOS GUI group is casks only'

      # Proves each script can actually start, not merely parse. --version
      # returns before anything that touches the system - and, for macOS,
      # before the Darwin check - so both are safe on a Linux runner.
      - name: Check the shell scripts can be launched
        run: |
          set -euo pipefail
          for pair in "linux:${{ steps.versions.outputs.linux }}" "macos:${{ steps.versions.outputs.macos }}"; do
            dir="${pair%%:*}"; expected="${pair#*:}"
            actual="$(bash "$dir/bootstrap.sh" --version | tr -d '[:space:]')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$dir/bootstrap.sh --version printed '$actual', expected '$expected'."
              exit 1
            fi
            echo "OK   $dir/bootstrap.sh --version -> $actual"
          done

      # --list-groups reads and renders a whole manifest through the same
      # nameref code a real run uses, and still exits before any platform check.
      - name: Check the manifests render
        run: |
          set -euo pipefail
          bash linux/bootstrap.sh --list-groups
          bash macos/bootstrap.sh --list-groups

      # The three manifests each claim their `cli` group is deliberately
      # identical. This checks it against tools/cli-parity.conf.
      #
      # It belongs here, unlike the checks in verify-manifests.yml, because it
      # asks nothing of the outside world - it compares three files in this
      # repository against a fourth. That is the line between the two
      # workflows: publishing may depend on what is committed, never on whether
      # someone else's package index is reachable this minute.
      - name: The cli group is the same on all three platforms
        run: bash tools/parity.sh

      # ------------------------------------------------------------------
      # Publish
      # ------------------------------------------------------------------

      # One archive per platform, each carrying that platform's directory ONLY.
      # A release asset should hold what you need to run the thing and nothing
      # else, so someone unpacking the macOS one on a fresh Mac is not handed
      # PowerShell and apt manifests to wonder about. GitHub attaches its own
      # "Source code" archives, which do contain the whole tree, for anyone who
      # wants it - and the point of one release is that all three are in easy
      # reach, not that they are in the same tarball.
      - name: Build the release archives
        id: archives
        run: |
          set -euo pipefail
          WINDOWS="bootstrap-windows-v${{ steps.versions.outputs.windows }}"
          LINUX="bootstrap-linux-v${{ steps.versions.outputs.linux }}"
          MACOS="bootstrap-macos-v${{ steps.versions.outputs.macos }}"

          mkdir -p "$WINDOWS" "$LINUX" "$MACOS"

          cp windows/bootstrap.ps1 \
             windows/packages.psd1 \
             windows/profile.ps1 \
             windows/merge-terminal-settings.ps1 \
             windows/README.md \
             windows/CHANGELOG.md \
             "$WINDOWS/"
          # -r, and a separate line from the cp above: windows/mpv is a
          # DIRECTORY, and it holds a script-opts/ subdirectory of its own. It
          # was missing from the archive entirely in 1.1.0, the release that
          # introduced the mpv phase - so a downloaded copy on a machine with
          # mpv installed died at Copy-Item with no source file. Nothing caught
          # it because every test run was from a git checkout, where the
          # directory is simply always there.
          cp -r windows/mpv "$WINDOWS/"

          cp linux/bootstrap.sh linux/packages.conf linux/README.md linux/CHANGELOG.md "$LINUX/"
          cp macos/bootstrap.sh macos/packages.conf macos/README.md macos/CHANGELOG.md "$MACOS/"
          chmod +x "$LINUX/bootstrap.sh" "$MACOS/bootstrap.sh"

          # zip for Windows, tar.gz for the Unixes: the format each platform can
          # open with nothing installed. A .tar.gz on a fresh Windows box is a
          # second problem to solve before you can run the first thing.
          zip -qr "$WINDOWS.zip" "$WINDOWS"
          tar -czf "$LINUX.tar.gz" "$LINUX"
          tar -czf "$MACOS.tar.gz" "$MACOS"

          for f in "$WINDOWS.zip" "$LINUX.tar.gz" "$MACOS.tar.gz"; do
            sha256sum "$f" | tee "$f.sha256"
          done

          {
            echo "windows=$WINDOWS.zip"
            echo "linux=$LINUX.tar.gz"
            echo "macos=$MACOS.tar.gz"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_ASSET: ${{ steps.archives.outputs.windows }}
          LINUX_ASSET: ${{ steps.archives.outputs.linux }}
          MACOS_ASSET: ${{ steps.archives.outputs.macos }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "bootstrap $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "$WINDOWS_ASSET" "$WINDOWS_ASSET.sha256" \
            "$LINUX_ASSET" "$LINUX_ASSET.sha256" \
            "$MACOS_ASSET" "$MACOS_ASSET.sha256"
