# starship.toml - one prompt config, deployed identically to all three
# platforms

"$schema" = 'https://starship.rs/config-schema.json'

palette = 'catppuccin_mocha'

add_newline = false

format = """
\n\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$character"""

right_format = """$nodejs$python$golang$rust$dotnet$docker_context$time"""

[palettes.catppuccin_mocha]
rosewater = '#f5e0dc'
flamingo  = '#f2cdcd'
pink      = '#f5c2e7'
mauve     = '#cba6f7'
red       = '#f38ba8'
maroon    = '#eba0ac'
peach     = '#fab387'
yellow    = '#f9e2af'
green     = '#a6e3a1'
teal      = '#94e2d5'
sky       = '#89dceb'
sapphire  = '#74c7ec'
blue      = '#89b4fa'
lavender  = '#b4befe'
text      = '#cdd6f4'
subtext1  = '#bac2de'
subtext0  = '#a6adc8'
overlay2  = '#9399b2'
overlay1  = '#7f849c'
overlay0  = '#6c7086'
surface2  = '#585b70'
surface1  = '#45475a'
surface0  = '#313244'
base      = '#1e1e2e'
mantle    = '#181825'
crust     = '#11111b'

# [profiles] - the alternate formats the shells swap in
[profiles]
transient = "[❯](green bold) "
rtransient = ""

ctx_kube      = "$kubernetes$helm$nodejs$python$golang$rust$dotnet$docker_context$time"
ctx_aws       = "$aws$nodejs$python$golang$rust$dotnet$docker_context$time"
ctx_azure     = "$azure$nodejs$python$golang$rust$dotnet$docker_context$time"
ctx_gcloud    = "$gcloud$nodejs$python$golang$rust$dotnet$docker_context$time"
ctx_terraform = "$terraform$nodejs$python$golang$rust$dotnet$docker_context$time"
ctx_dotnet    = "${custom.dotnet_sdk}$nodejs$python$golang$rust$docker_context$time"

# Claude Code statusline - rendered by `starship statusline claude-code`,
# wired up via `.claude/settings.json`'s statusLine.command (run /statusline
# in Claude Code, or set it by hand). This is the whole line Claude Code
# shows, not an addition to the shell prompt above, so it repeats
# directory/git_branch rather than relying on the main $format.
claude-code = "$directory$git_branch$claude_model$claude_context$claude_cost"

[character]
success_symbol = '[❯](green bold)'
error_symbol = '[❯](red bold)'
vimcmd_symbol = '[❮](green bold)'

[username]
style_user = 'yellow bold'
format = '[$user]($style)@'

[hostname]
ssh_symbol = '🌐 '
style = 'overlay1 bold'
format = '[$ssh_symbol$hostname]($style) '

[directory]
style = 'blue bold'
truncation_length = 8
truncate_to_repo = false
truncation_symbol = '…/'
repo_root_style = 'blue bold'
before_repo_root_style = 'overlay1'

[git_branch]
style = 'mauve bold'
symbol = ' '
format = '[$symbol$branch]($style) '

[git_status]
style = 'yellow bold'
format = '($all_status$ahead_behind)'
conflicted = '[~${count} ](red bold)'
staged     = '[+${count} ](green bold)'
modified   = '[!${count} ](yellow bold)'
untracked  = '[?${count} ](sky bold)'
deleted    = '[✘${count} ](red bold)'
renamed    = '[»${count} ](mauve bold)'
stashed    = '[*${count} ](teal bold)'
ahead      = '[⇡${count} ](peach bold)'
behind     = '[⇣${count} ](peach bold)'
diverged   = '[⇡${ahead_count}⇣${behind_count} ](peach bold)'
up_to_date = ''

[git_state]
style = 'red bold'

[cmd_duration]
min_time = 2000
style = 'peach bold'
format = 'took [$duration]($style) '

# The context modules
[aws]
disabled = false
force_display = true
style = 'peach bold'
symbol = 'aws '
format = '[$symbol($profile )(\($region\) )]($style)'

[azure]
disabled = false
style = 'sapphire bold'
symbol = 'az '
format = '[$symbol$subscription]($style) '

[gcloud]
disabled = false
style = 'red bold'
symbol = 'gcp '
format = '[$symbol$account(@$domain)(\($region\))]($style) '

[terraform]
disabled = false
style = 'lavender bold'
symbol = 'tf '
format = '[$symbol$workspace]($style) '
detect_extensions = ['tf', 'tfplan', 'tfstate', 'tfvars']
detect_files = ['terragrunt.hcl', 'terragrunt.hcl.json', '.terraform.lock.hcl', '.terraform-version']
detect_folders = ['.terraform']

[kubernetes]
disabled = false
symbol = '☸ '
style = 'blue bold'
format = '[$symbol$context( \($namespace\))]($style) '

[helm]
style = 'teal bold'
symbol = '⎈ '
format = '[$symbol($version )]($style)'

# Claude Code statusline modules - only meaningful under the claude-code
# profile above; harmless elsewhere since the shell prompt never renders them.
[claude_model]
style = 'pink bold'
symbol = '🤖 '
format = '[$symbol$model]($style) '

[claude_context]
format = '[$gauge $percentage]($style) '
gauge_width = 10
gauge_full_symbol = '█'
gauge_partial_symbol = '▒'
gauge_empty_symbol = '░'

[[claude_context.display]]
threshold = 0
style = 'green bold'
hidden = true

[[claude_context.display]]
threshold = 30
style = 'green bold'

[[claude_context.display]]
threshold = 60
style = 'yellow bold'

[[claude_context.display]]
threshold = 80
style = 'red bold'

[claude_cost]
symbol = '💰 '
format = '[$symbol$cost]($style) '

[[claude_cost.display]]
threshold = 0
style = 'green bold'
hidden = true

[[claude_cost.display]]
threshold = 1
style = 'yellow bold'

[[claude_cost.display]]
threshold = 5
style = 'red bold'

[custom.dotnet_sdk]
command = 'dotnet --version'
when = true
style = 'mauve bold'
symbol = '.NET '
format = '([$symbol$output ]($style))'

# Toolchain versions - the right prompt's baseline
[nodejs]
style = 'green bold'
symbol = ' '
format = '[$symbol($version )]($style)'

[python]
style = 'yellow bold'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[golang]
style = 'sapphire bold'
symbol = ' '
format = '[$symbol($version )]($style)'

[rust]
style = 'peach bold'
symbol = ' '
format = '[$symbol($version )]($style)'

[dotnet]
style = 'mauve bold'
symbol = '.NET '
format = '[$symbol($version )(🎯 $tfm )]($style)'

[docker_context]
style = 'blue bold'
symbol = ' '
format = '[$symbol$context]($style) '

[time]
disabled = false
style = 'overlay1'
format = '[$time]($style)'
time_format = '%H:%M'
