# ============================================================
# input.conf - managed by windows/bootstrap.ps1
# ============================================================
# Lines ending in "#! Label" are read by uosc to build its menu; that is uosc
# convention, not an mpv one, and the leading # means mpv itself ignores those
# lines as comments. A menu entry with no key is written as "#" in the key
# column - it appears in the menu but is bound to nothing.

# --- Menu ----------------------------------------------------------------
mbtn_right    script-binding uosc/menu
menu          script-binding uosc/menu

# --- Playback ------------------------------------------------------------
mbtn_left     cycle pause
space         cycle pause
RIGHT         seek  5
LEFT          seek -5
UP            seek  60
DOWN          seek -60
[             multiply speed 1/1.1
]             multiply speed 1.1
BS            set speed 1.0

# --- Volume --------------------------------------------------------------
WHEEL_UP      add volume 5
WHEEL_DOWN    add volume -5
m             cycle mute

# --- Window --------------------------------------------------------------
f             cycle fullscreen
mbtn_left_dbl cycle fullscreen
ESC           set fullscreen no

# --- uosc menu -----------------------------------------------------------
#             script-binding uosc/subtitles            #! Subtitles
#             script-binding uosc/audio                #! Audio tracks
#             script-binding uosc/stream-quality       #! Stream quality
#             script-binding uosc/playlist             #! Playlist
#             script-binding uosc/chapters             #! Chapters
#             script-binding uosc/video                #! Video tracks
#             script-binding uosc/open-file            #! Navigation > Open file
#             script-binding uosc/show-in-directory    #! Navigation > Show in directory
# memo binds `h` itself; naming it here is documentation, not configuration -
# the menu entry is the part that would otherwise be missing.
h             script-binding memo-history              #! Navigation > Recently played
#             script-binding uosc/audio-device         #! Audio device
#             script-binding uosc/keybinds             #! Keybinds
q             quit                                     #! Quit
