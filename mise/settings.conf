# Global mise settings, one `key=value` per line, shared by all three
# platforms.
#
# Applied with `mise settings set`, which writes the [settings] table of the
# user's global ~/.config/mise/config.toml and leaves [tools] alone. A key
# already set there to something else is yours: reported as `present` and
# left alone, the same way the git defaults are. Comments and blank lines are
# ignored; a list is comma-separated, no spaces.

# Read the version files other tools leave in a project - .nvmrc and
# .node-version, .python-version, .ruby-version, .go-version - so cd'ing into
# someone else's repo picks its runtime without adding a mise.toml to it. mise
# ships this list empty. A version that is not installed yet is installed on
# first use (not_found_auto_install, on by default).
idiomatic_version_file_enable_tools=node,python,ruby,go
