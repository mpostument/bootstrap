name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Read each platform's version
        id: versions
        run: |
          set -euo pipefail
          WINDOWS="$(grep -m1 '^\$script:BootstrapVersion' windows/bootstrap.ps1 | cut -d"'" -f2)"
          LINUX="$(grep -m1 '^BOOTSTRAP_VERSION=' linux/bootstrap.sh | cut -d"'" -f2)"
          MACOS="$(grep -m1 '^BOOTSTRAP_VERSION=' macos/bootstrap.sh | cut -d"'" -f2)"

          failed=0
          for pair in "windows:$WINDOWS" "linux:$LINUX" "macos:$MACOS"; do
            name="${pair%%:*}"; version="${pair#*:}"
            if [ -z "$version" ]; then
              echo "::error::Could not read a version out of the $name script."
              echo "::error::The release workflow parses one exact line - check its shape."
              failed=1
            else
              echo "OK   $name $version"
            fi
          done
          [ "$failed" -eq 0 ]

          {
            echo "windows=$WINDOWS"
            echo "linux=$LINUX"
            echo "macos=$MACOS"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble the release notes
        run: |
          set -euo pipefail
          : > release-notes.md

          extract() {
            local dir="$1" label="$2" version="$3"
            awk -v v="$version" '
              $0 == "## [" v "]" { found = 1; next }
              found && index($0, "## [") == 1 { exit }
              found              { print }
            ' "$dir/CHANGELOG.md"
          }

          failed=0
          for entry in \
            "windows:Windows:${{ steps.versions.outputs.windows }}" \
            "linux:Linux:${{ steps.versions.outputs.linux }}" \
            "macos:macOS:${{ steps.versions.outputs.macos }}"
          do
            dir="${entry%%:*}"; rest="${entry#*:}"
            label="${rest%%:*}"; version="${rest#*:}"

            body="$(extract "$dir" "$label" "$version")"
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              echo "::error file=$dir/CHANGELOG.md::No '## [$version]' section, but $dir says it is version $version."
              failed=1
              continue
            fi
            {
              printf '# %s %s\n\n' "$label" "$version"
              printf '%s\n\n' "$body"
            } >> release-notes.md
          done
          [ "$failed" -eq 0 ]

          echo "OK   release notes: $(wc -l < release-notes.md) lines"

      - name: Validate the PowerShell that is about to ship
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem windows/*.ps1) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$errors)
              if ($errors.Count) {
                  $failed = $true
                  foreach ($e in $errors) {
                      Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                  }
              } else {
                  Write-Host "OK   $($file.Name)"
              }
          }
          $m = Import-PowerShellDataFile windows/packages.psd1
          $required = @('Groups', 'Pins', 'Managed', 'Shell', 'Mpv', 'Schedule', 'Git')
          $absent = @($required | Where-Object { -not $m.Contains($_) })
          if ($absent.Count) {
              $failed = $true
              Write-Host "::error file=windows/packages.psd1::Missing section(s): $($absent -join ', ')"
          }
          $count = ($m.Groups | ForEach-Object { $_.Packages.Count } | Measure-Object -Sum).Sum
          Write-Host "OK   packages.psd1 - $($m.Groups.Count) groups, $count packages, sections: $(@($m.Keys) -join ', ')"
          if ($failed) { exit 1 }

      - name: Check no loop variable shadows a script-scoped variable
        shell: pwsh
        run: |
          $bad = $false
          foreach ($file in Get-ChildItem windows/*.ps1) {
              $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$null)

              $scoped = $ast.FindAll({
                      param($n)
                      $n -is [System.Management.Automation.Language.VariableExpressionAst] -and
                      $n.VariablePath.IsScript
                  }, $true) |
                  ForEach-Object { $_.VariablePath.UserPath -replace '^(?i)script:', '' } |
                  Sort-Object -Unique

              $ast.FindAll({
                      param($n)
                      $n -is [System.Management.Automation.Language.ForEachStatementAst]
                  }, $true) | ForEach-Object {
                  $name = $_.Variable.VariablePath.UserPath
                  if ($scoped -contains $name) {
                      $bad = $true
                      Write-Host "::error file=$($file.FullName),line=$($_.Extent.StartLineNumber)::foreach variable `$$name shadows script-scoped `$script:$name - rename one of them"
                  }
              }
          }
          if ($bad) { exit 1 }
          Write-Host 'OK   no loop variable shadows a script-scoped variable'

      - name: Check the Windows script can be launched with -File
        run: |
          set -euo pipefail
          ACTUAL="$(pwsh -File windows/bootstrap.ps1 -ShowVersion | tr -d '[:space:]')"
          EXPECTED="${{ steps.versions.outputs.windows }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::pwsh -File bootstrap.ps1 -ShowVersion printed '$ACTUAL', expected '$EXPECTED'."
            exit 1
          fi
          echo "OK   pwsh -File bootstrap.ps1 -ShowVersion -> $ACTUAL"

      - name: Validate the shell that is about to ship
        run: |
          set -euo pipefail
          failed=0
          for f in linux/*.sh macos/*.sh; do
            if bash -n "$f"; then
              echo "OK   $f"
            else
              echo "::error file=$f::bash -n failed"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      - name: Shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --external-sources --source-path=linux linux/bootstrap.sh
          shellcheck --external-sources --source-path=macos macos/bootstrap.sh

      - name: Validate the Linux manifest
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . linux/packages.conf
          for required in PKG_GROUPS MANUAL HELD TOOLS REPOS RELEASES ZSH_PLUGINS ZSH_CUSTOM_PLUGINS \
                          DOTNET_ENABLED ZSH_ENABLED NERD_FONT_ENABLED CLAUDE_CODE_ENABLED \
                          MISE_ENABLED; do
            if ! declare -p "$required" >/dev/null 2>&1; then
              echo "::error file=linux/packages.conf::missing \$$required"
              exit 1
            fi
          done
          total=0
          for g in "${PKG_GROUPS[@]}"; do
            declare -n _apt="GROUP_${g}_APT"
            declare -n _flat="GROUP_${g}_FLATPAK"
            total=$(( total + ${#_apt[@]} + ${#_flat[@]} ))
            unset -n _apt _flat
          done
          echo "OK   linux/packages.conf - ${#PKG_GROUPS[@]} groups, $total packages, ${#REPOS[@]} repositories"

      - name: Validate the macOS manifest
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . macos/packages.conf
          for required in PKG_GROUPS MANUAL HELD TOOLS TAPS ZSH_PLUGINS ZSH_CUSTOM_PLUGINS \
                          ZSH_ENABLED; do
            if ! declare -p "$required" >/dev/null 2>&1; then
              echo "::error file=macos/packages.conf::missing \$$required"
              exit 1
            fi
          done
          total=0
          for g in "${PKG_GROUPS[@]}"; do
            declare -n _form="GROUP_${g}_FORMULA"
            declare -n _cask="GROUP_${g}_CASK"
            total=$(( total + ${#_form[@]} + ${#_cask[@]} ))
            unset -n _form _cask
          done
          echo "OK   macos/packages.conf - ${#PKG_GROUPS[@]} groups, $total packages, ${#TAPS[@]} taps"

      - name: Check no macOS GUI group carries headless-only software
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . macos/packages.conf
          bad=0
          for g in "${PKG_GROUPS[@]}"; do
            gui_var="GROUP_${g}_GUI"
            declare -n _form="GROUP_${g}_FORMULA"
            if [ "${!gui_var:-no}" = "yes" ] && [ "${#_form[@]}" -gt 0 ]; then
              echo "::error file=macos/packages.conf::group '$g' is GUI=yes but lists ${#_form[@]} formula(e) - --no-gui would skip those too"
              bad=1
            fi
            unset -n _form
          done
          [ "$bad" -eq 0 ]
          echo 'OK   every macOS GUI group is casks only'

      - name: Check the shell scripts can be launched
        run: |
          set -euo pipefail
          for pair in "linux:${{ steps.versions.outputs.linux }}" "macos:${{ steps.versions.outputs.macos }}"; do
            dir="${pair%%:*}"; expected="${pair#*:}"
            actual="$(bash "$dir/bootstrap.sh" --version | tr -d '[:space:]')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$dir/bootstrap.sh --version printed '$actual', expected '$expected'."
              exit 1
            fi
            echo "OK   $dir/bootstrap.sh --version -> $actual"
          done

      - name: Check the manifests render
        run: |
          set -euo pipefail
          bash linux/bootstrap.sh --list-groups
          bash macos/bootstrap.sh --list-groups

      - name: The cli group is the same on all three platforms
        run: bash tools/parity.sh

      - name: Build the release archives
        id: archives
        run: |
          set -euo pipefail
          WINDOWS="bootstrap-windows-v${{ steps.versions.outputs.windows }}"
          LINUX="bootstrap-linux-v${{ steps.versions.outputs.linux }}"
          MACOS="bootstrap-macos-v${{ steps.versions.outputs.macos }}"

          mkdir -p "$WINDOWS" "$LINUX" "$MACOS"

          cp windows/bootstrap.ps1 \
             windows/packages.psd1 \
             windows/profile.ps1 \
             windows/merge-terminal-settings.ps1 \
             windows/README.md \
             windows/CHANGELOG.md \
             "$WINDOWS/"
          cp -r windows/mpv "$WINDOWS/"

          cp linux/bootstrap.sh linux/packages.conf linux/README.md linux/CHANGELOG.md "$LINUX/"
          cp macos/bootstrap.sh macos/packages.conf macos/README.md macos/CHANGELOG.md "$MACOS/"
          chmod +x "$LINUX/bootstrap.sh" "$MACOS/bootstrap.sh"

          zip -qr "$WINDOWS.zip" "$WINDOWS"
          tar -czf "$LINUX.tar.gz" "$LINUX"
          tar -czf "$MACOS.tar.gz" "$MACOS"

          for f in "$WINDOWS.zip" "$LINUX.tar.gz" "$MACOS.tar.gz"; do
            sha256sum "$f" | tee "$f.sha256"
          done

          {
            echo "windows=$WINDOWS.zip"
            echo "linux=$LINUX.tar.gz"
            echo "macos=$MACOS.tar.gz"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WINDOWS_ASSET: ${{ steps.archives.outputs.windows }}
          LINUX_ASSET: ${{ steps.archives.outputs.linux }}
          MACOS_ASSET: ${{ steps.archives.outputs.macos }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "bootstrap $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "$WINDOWS_ASSET" "$WINDOWS_ASSET.sha256" \
            "$LINUX_ASSET" "$LINUX_ASSET.sha256" \
            "$MACOS_ASSET" "$MACOS_ASSET.sha256"
