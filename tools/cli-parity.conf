# ============================================================
# cli-parity.conf - what "the same bundle on all three" actually means
# ============================================================
# All three manifests claim, in prose, that the `cli` group is deliberately
# identical so muscle memory transfers between the shells. Prose cannot rot
# loudly: `yq` sat in the Linux group for months resolving to a DIFFERENT
# PROGRAM from the one the other two installed, and nothing said a word,
# because a wrong name that installs cleanly looks exactly like a right one.
#
# This file is that claim written down so parity.sh can check it. One row per
# tool, naming what the tool is called on each platform - because the same
# program has three names and comparing the manifests directly would report
# every single line as a difference.
#
# Fields, separated by `|` and trimmed:
#
#   canonical | linux | macos | windows | note
#
# A cell holds the package name on that platform, or one of:
#
#   -          deliberately absent. The note MUST say why. This is the whole
#              point of the file: a divergence somebody chose is fine, and a
#              divergence nobody noticed is the bug.
#   @releases  present on Linux, but as a RELEASES static binary rather than an
#              apt package. Still parity - the command exists and behaves the
#              same - just owned by a different phase.
#
# Adding a tool to one platform and not the others is allowed. Adding it
# without a row here is not: parity.sh fails on any manifest entry it cannot
# find, so the choice has to be written down rather than merely made.

bat        | bat         | bat       | sharkdp.bat             |
eza        | eza         | eza       | eza-community.eza       | not in bookworm's archive; reported `missing` there
fd         | fd-find     | fd        | sharkdp.fd              | Debian renames the binary to fdfind; the zsh fragment aliases it
ripgrep    | ripgrep     | ripgrep   | BurntSushi.ripgrep.MSVC |
zoxide     | zoxide      | zoxide    | ajeetdsouza.zoxide      |
fzf        | fzf         | fzf       | junegunn.fzf            |
jq         | jq          | jq        | jqlang.jq               |
yq         | @releases   | yq       | MikeFarah.yq             | Debian's `yq` is kislyuk's jq wrapper, a different program - taken as a release binary instead
7zip       | 7zip        | sevenzip  | 7zip.7zip               | p7zip is unmaintained upstream; 7zip/sevenzip are its successor on each archive
yt-dlp     | yt-dlp      | yt-dlp    | yt-dlp.yt-dlp           |
ffmpeg     | ffmpeg      | ffmpeg    | yt-dlp.FFmpeg           | winget has no standalone ffmpeg worth pinning; the yt-dlp build is the one that gets updated
btop       | btop        | btop      | -                       | btop4win exists but is a separate, less-maintained port
tree       | tree        | tree      | -                       | Windows ships tree.com in the base system
vim        | vim         | vim       | -                       | GAP, not a decision - vim.vim is in winget and should be added
tmux       | tmux        | tmux      | -                       | no Windows analogue; Windows Terminal panes are the equivalent
unzip      | unzip       | -         | -                       | in the base system on macOS; 7zip covers it on Windows
cifs-utils | cifs-utils  | -         | -                       | Linux-only; macOS mounts SMB in Finder and with mount_smbfs
exfatprogs | exfatprogs  | -         | -                       | Linux-only; kernel support is built in on macOS and Windows
