# ============================================================
# packages.conf - the manifest bootstrap.sh reads
# ============================================================
# Sourced as bash, not parsed, so it can use arrays and comments freely. Keep
# it declarative: this file says WHAT, bootstrap.sh decides how.
#
# Software is sorted the same way the Windows manifest sorts it - by who owns
# it - because that is the distinction that matters when an update run goes
# wrong:
#
#   APT      installed and upgraded from the distribution's own repositories
#   FLATPAK  installed and upgraded from Flathub
#   TOOLS    version managers and SDKs that install themselves into $HOME
#   MANUAL   reported only; needs a vendor repository this script will not add
#
# The last category is not laziness. Adding a third-party apt repository means
# trusting a signing key and letting that vendor push packages to this machine
# forever, which is a decision to make by hand and not a line in a loop.
#
# NOT named GROUPS. That is a bash builtin holding the current user's group
# IDs, so assigning to it silently does nothing and every group name in this
# file becomes a number. Measured, not theorised: the first version of this
# manifest did exactly that and the run reported groups called 1000 and 27.

# ------------------------------------------------------------
# Groups
# ------------------------------------------------------------
# GROUP_<name>_GUI=yes marks a group that needs a desktop. On a machine with no
# desktop environment those groups are reported as `no-gui` and skipped, which
# is the whole reason a server and a workstation can share one manifest.
PKG_GROUPS=(shell cli dev infra creative apps)

# --- shell ---------------------------------------------------------------
GROUP_shell_DESC="Shell, prompt and the tools a login needs"
GROUP_shell_GUI=no
# flatpak here rather than in a desktop group: installing it is cheap, and the
# apps group cannot install anything from Flathub without it. bootstrap.sh adds
# the flathub remote itself once the binary exists.
GROUP_shell_APT=(zsh git curl wget ca-certificates gnupg apt-transport-https flatpak)
GROUP_shell_FLATPAK=()

# --- cli -----------------------------------------------------------------
GROUP_cli_DESC="Modern CLI bundle - nicer cat, ls, find and grep"
GROUP_cli_GUI=no
# Deliberately the same bundle as the Windows side, so muscle memory transfers
# between the two shells. Debian renames two of these binaries to dodge a clash
# with older archive packages: fd-find installs as `fdfind` and bat as
# `batcat`. Both renames are long-standing and stable across releases; the
# managed .zshrc aliases them and guards each on `command -v` first.
#
# eza is not in every Debian release's archive - it is missing on bookworm and
# present on trixie. bootstrap.sh reports a package the release does not carry
# as `missing` rather than failing the run.
GROUP_cli_APT=(
  bat
  eza
  fd-find
  ripgrep
  zoxide
  fzf
  jq
  yq
  p7zip-full
  yt-dlp
  ffmpeg
  htop
  tree
  unzip
  vim
  screen
  cifs-utils
  exfatprogs
)
GROUP_cli_FLATPAK=()

# --- dev -----------------------------------------------------------------
GROUP_dev_DESC="Runtimes, toolchains and build dependencies"
GROUP_dev_GUI=no
# Node and the system Python come from the distribution. Whatever the release
# ships is a version somebody else is already patching; per-project versions
# are what pyenv below is for, rather than fighting the archive.
#
# The long tail from libssl-dev onward is not padding - it is exactly what
# pyenv needs to BUILD a Python. Without it `pyenv install` fails late, in a
# compiler error that says nothing about a missing header.
GROUP_dev_APT=(
  python3
  python3-pip
  python3-venv
  nodejs
  npm
  golang-go
  default-jdk
  gh
  shellcheck
  make
  build-essential
  libssl-dev
  zlib1g-dev
  libbz2-dev
  libreadline-dev
  libsqlite3-dev
  llvm
  libncurses-dev
  xz-utils
  tk-dev
  libffi-dev
  liblzma-dev
)
GROUP_dev_FLATPAK=()

# --- infra ---------------------------------------------------------------
GROUP_infra_DESC="Configuration management and linting"
GROUP_infra_GUI=no
# Ansible from the distribution rather than pip: it is the control node for a
# fleet, and a system package that the distribution patches is the right shape
# for that. The linters are here because they are what the fleet repository's
# pre-commit hooks call.
GROUP_infra_APT=(
  ansible
  ansible-lint
  yamllint
  pre-commit
)
GROUP_infra_FLATPAK=()

# --- creative ------------------------------------------------------------
GROUP_creative_DESC="3D, 2D and capture tooling"
GROUP_creative_GUI=yes
# Blender from Flathub rather than apt on purpose: the distribution package is
# routinely a major version behind, and this is exactly the kind of software
# where that matters. Everything here needs a desktop, which is what
# GROUP_creative_GUI=yes above says.
GROUP_creative_APT=(gimp inkscape obs-studio)
GROUP_creative_FLATPAK=(org.blender.Blender)

# --- apps ----------------------------------------------------------------
GROUP_apps_DESC="Everyday desktop applications"
GROUP_apps_GUI=yes
GROUP_apps_APT=(vlc mpv qbittorrent)
GROUP_apps_FLATPAK=(md.obsidian.Obsidian org.telegram.desktop)

# ------------------------------------------------------------
# Tools that install themselves into $HOME
# ------------------------------------------------------------
# Version managers and SDKs that are not apt packages and should not be. Each
# is a git clone or a vendor script writing under the user's home directory,
# which means no root, no third-party apt key, and nothing system-wide to
# conflict with the distribution's own packages.
#
# Deliberately UNPINNED, tracking each upstream's default branch. Same call as
# the mpv scripts and the zsh plugins: this is a personal machine somebody uses
# interactively, where staying current beats reproducibility. Fleet
# infrastructure is a different question and lives in a different repository.
TOOL_pyenv_DESC="Python version manager"
TOOL_pyenv_DIR="${HOME}/.pyenv"
TOOL_pyenv_REPO="https://github.com/pyenv/pyenv.git"
TOOL_pyenv_BIN="${HOME}/.pyenv/bin/pyenv"

# A pyenv plugin, so it clones INTO pyenv's plugins directory and only makes
# sense once pyenv itself is there. bootstrap.sh installs tools in the order
# listed for that reason.
TOOL_pyenv_virtualenv_DESC="pyenv virtualenv plugin"
TOOL_pyenv_virtualenv_DIR="${HOME}/.pyenv/plugins/pyenv-virtualenv"
TOOL_pyenv_virtualenv_REPO="https://github.com/pyenv/pyenv-virtualenv.git"
TOOL_pyenv_virtualenv_BIN=""

# Terraform is not in the Debian archive and its own repository needs a
# HashiCorp signing key. tfenv sidesteps both: it is a git clone that fetches
# release binaries into $HOME, and it makes the version a per-project decision
# rather than a machine-wide one.
TOOL_tfenv_DESC="Terraform version manager"
TOOL_tfenv_DIR="${HOME}/.tfenv"
TOOL_tfenv_REPO="https://github.com/tfutils/tfenv.git"
TOOL_tfenv_BIN="${HOME}/.tfenv/bin/tfenv"

TOOLS=(pyenv pyenv_virtualenv tfenv)

# --- .NET SDK ------------------------------------------------------------
# Microsoft's own installer script, into $HOME, rather than the packages.
#
# Note the shape this has: dotnet-install.sh installs side by side under
# sdk/<version> rather than replacing, so a channel rollover leaves the
# previous major on disk forever. Old SDKs are reported, never deleted.
DOTNET_ENABLED=yes
# A concrete major, not "LTS". The Windows manifest installs
# Microsoft.DotNet.SDK.10, and the two sides drifting apart is worse than
# either being a release behind - a channel alias would move one of them on its
# own schedule. Bump this and the Windows id together.
DOTNET_CHANNEL="10.0"
DOTNET_DIR="${HOME}/.dotnet"

# ------------------------------------------------------------
# zsh
# ------------------------------------------------------------
# oh-my-zsh with powerlevel10k, matching the fleet's zsh role so the shell is
# the same on every machine that gets one.
#
# Order matters in ZSH_PLUGINS, not just membership. zsh-syntax-highlighting
# must be the LAST plugin oh-my-zsh sources except one: it wraps ZLE widgets to
# add highlighting, and any plugin loaded after it defines its widgets outside
# that wrapping, so their output goes unhighlighted. history-substring-search
# is the documented exception and must come after it. fzf-tab has the opposite
# constraint - after compinit, which oh-my-zsh runs before sourcing plugins,
# but before anything that wraps ZLE widgets - so first is the only position
# that satisfies it.
ZSH_ENABLED=yes
ZSH_THEME="powerlevel10k/powerlevel10k"
ZSH_PLUGINS=(
  fzf-tab
  git
  zsh-autosuggestions
  command-not-found
  extract
  docker-compose
  ansible
  docker
  golang
  jsontools
  pip
  virtualenv
  zsh-completions
  gitignore
  pyenv
  fzf
  zsh-syntax-highlighting
  history-substring-search
)

# name|repo, cloned into oh-my-zsh's custom directory. Unpinned, tracking each
# upstream's default branch, for the same reason as TOOLS above.
ZSH_CUSTOM_PLUGINS=(
  "zsh-syntax-highlighting|https://github.com/zsh-users/zsh-syntax-highlighting.git"
  "zsh-autosuggestions|https://github.com/zsh-users/zsh-autosuggestions.git"
  "zsh-completions|https://github.com/zsh-users/zsh-completions.git"
  "fzf-tab|https://github.com/Aloxaf/fzf-tab.git"
)
ZSH_THEME_REPO="https://github.com/romkatv/powerlevel10k.git"

# ------------------------------------------------------------
# Held
# ------------------------------------------------------------
# Neither installed nor upgraded; reported as `held` so it stays visible rather
# than quietly absent. Format: "package:reason".
HELD=()

# ------------------------------------------------------------
# Third-party apt repositories
# ------------------------------------------------------------
# Software that is not in the distribution archive and ships its own repository
# instead. bootstrap.sh fetches the signing key into /etc/apt/keyrings, writes
# a deb822 .sources file that is scoped to that one key, and then installs the
# packages like any other.
#
# Understand what this is before adding to it: a repository here can push a
# package to this machine on every future update run, forever. That is why each
# entry names its key URL explicitly rather than piping a vendor script into a
# shell, why the key is scoped with Signed-By to its own repository rather than
# trusted globally, and why apt-key - which trusts a key for EVERY repository
# on the system - is not used anywhere.
#
# REPO_<name>_GUI=yes marks one that only makes sense with a desktop, and it is
# skipped on a headless machine exactly like a GUI package group.
REPOS=(vscode docker unityhub)

REPO_vscode_DESC="Visual Studio Code"
REPO_vscode_GUI=yes
REPO_vscode_KEY_URL="https://packages.microsoft.com/keys/microsoft.asc"
REPO_vscode_URI="https://packages.microsoft.com/repos/code"
REPO_vscode_SUITES="stable"
REPO_vscode_COMPONENTS="main"
REPO_vscode_PACKAGES=(code)

REPO_docker_DESC="Docker Engine"
REPO_docker_GUI=no
# {ID} and {CODENAME} are substituted from /etc/os-release: Docker publishes a
# separate tree per distribution and per release, and pointing Ubuntu at the
# Debian one installs packages built against the wrong libc.
REPO_docker_KEY_URL="https://download.docker.com/linux/{ID}/gpg"
REPO_docker_URI="https://download.docker.com/linux/{ID}"
REPO_docker_SUITES="{CODENAME}"
REPO_docker_COMPONENTS="stable"
REPO_docker_PACKAGES=(docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin)

REPO_unityhub_DESC="Unity Hub"
REPO_unityhub_GUI=yes
REPO_unityhub_KEY_URL="https://hub.unity3d.com/linux/keys/public"
REPO_unityhub_URI="https://hub.unity3d.com/linux/repos/deb"
REPO_unityhub_SUITES="stable"
REPO_unityhub_COMPONENTS="main"
REPO_unityhub_PACKAGES=(unityhub)

# ------------------------------------------------------------
# Manual
# ------------------------------------------------------------
# Still detected and reported, never installed - for anything that has no
# repository worth adding. Format is "command:name:where-to-get-it".
MANUAL=()
