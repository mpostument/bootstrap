# canonical | linux | macos | windows | note | cmd | desc
# cells: package name, `-` deliberately absent (note says why),
# `@releases` a release binary rather than an apt package.
bat        | @releases   | bat       | sharkdp.bat             |                                                                                     | bat        | cat with syntax highlighting and line numbers
delta      | @releases   | git-delta | dandavison.delta        |                                                                                     | delta      | git diffs with syntax highlighting and word-level detail
difftastic | @releases   | difftastic | Wilfred.difftastic      | not in the Debian archive - taken as a release binary                               | difft      | structural diff - compares syntax, so a reformat is not a change
eza        | @releases   | eza       | eza-community.eza       |                                                                                    | eza        | ls with icons, git status and colour
fd         | @releases   | fd        | sharkdp.fd              |                                                                                    | fd         | fast, friendlier find
ripgrep    | @releases   | ripgrep   | BurntSushi.ripgrep.MSVC |                                                                                     | rg         | fast recursive grep
zoxide     | @releases   | zoxide    | ajeetdsouza.zoxide      |                                                                                     | z          | cd that learns your most-used directories (raw binary: zoxide)
fzf        | @releases   | fzf       | junegunn.fzf            |                                                                                     | fzf        | fuzzy finder for anything piped into it
jq         | @releases   | jq        | jqlang.jq               |                                                                                     | jq         | JSON query/filter language
yq         | @releases   | yq       | MikeFarah.yq             | Debian's `yq` is kislyuk's jq wrapper, a different program - taken as a release binary instead | yq | the Go program by mikefarah - YAML/JSON/XML query, same syntax as jq
7zip       | 7zip        | sevenzip  | 7zip.7zip               | p7zip is unmaintained upstream; 7zip/sevenzip are its successor on each archive    | 7z (macOS: 7zz; Windows: not on PATH by default - see the 7-Zip installer note) | archiver, reads/writes 7z/zip/etc
yt-dlp     | @releases   | yt-dlp    | yt-dlp.yt-dlp           |                                                                                     | yt-dlp     | download video/audio from YouTube and ~1800 other sites
ffmpeg     | ffmpeg      | ffmpeg    | yt-dlp.FFmpeg           | winget has no standalone ffmpeg worth pinning; the yt-dlp build is the one that gets updated | ffmpeg | convert/transcode audio and video
procs      | @releases   | procs     | dalance.procs           |                                                                                     | procs      | colourised ps replacement, docker-aware
dust       | @releases   | dust      | bootandy.dust           |                                                                                     | dust       | du replacement, shows the biggest directories first
duf        | @releases   | duf       | muesli.duf              |                                                                                     | duf        | df replacement, colourised disk usage table
glow       | @releases   | glow      | charmbracelet.glow      |                                                                                     | glow       | renders markdown in the terminal
fx         | @releases   | fx        | -                       | not in the Debian archive - taken as a release binary; no winget package             | fx         | interactive JSON viewer/processor
lnav       | @releases   | lnav      | tstack.lnav             |                                                                                     | lnav       | log file navigator, auto-detects format and timestamps
btop       | @releases   | btop      | -                       | btop4win exists but is a separate, less-maintained port                            | btop       | resource monitor - cpu/mem/disk/net/process list
tree       | tree        | tree      | -                       | Windows ships tree.com in the base system                                          | tree       | recursive directory listing as a tree
vim        | vim         | vim       | -                       | GAP, not a decision - vim.vim is in winget and should be added                     | vim        | the editor
tmux       | tmux        | tmux      | -                       | no Windows analogue; Windows Terminal panes are the equivalent                     | tmux       | terminal multiplexer - panes and sessions that survive a disconnect
unzip      | unzip       | -         | -                       | in the base system on macOS; 7zip covers it on Windows                             | unzip      | extract .zip archives
cifs-utils | cifs-utils  | -         | -                       | Linux-only; macOS mounts SMB in Finder and with mount_smbfs                        | mount -t cifs | SMB/CIFS network share mounting support (not a command of its own)
