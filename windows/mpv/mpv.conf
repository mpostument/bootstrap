# ============================================================
# mpv.conf - managed by windows/bootstrap.ps1
# ============================================================
# Edit this file in the repo, not %APPDATA%\mpv\ - the next bootstrap run
# overwrites the deployed copy. A config found in place WITHOUT the "managed
# by" line above is treated as hand-written and copied to .bak first.

# --- Video ---------------------------------------------------------------
# gpu-next is mpv's current renderer (libplacebo). d3d11 rather than letting
# it choose: on Windows the GL path goes through a translation layer and is
# measurably worse at presentation timing.
vo=gpu-next
gpu-api=d3d11
profile=high-quality

# auto-safe, not plain auto: it only enables hardware decoding for codecs the
# driver handles correctly, which is what stops the occasional green-frame or
# broken-10-bit-HEVC surprise. Software decode is fine on this hardware.
hwdec=auto-safe

# --- Window --------------------------------------------------------------
keep-open=yes
autofit-larger=90%x90%
cursor-autohide=1000

# --- Audio ---------------------------------------------------------------
volume=100
volume-max=150
audio-file-auto=fuzzy
alang=en,eng,ja,jpn

# --- Subtitles -----------------------------------------------------------
sub-auto=fuzzy
slang=en,eng
sub-font-size=42
sub-border-size=2.5
# Keep the size and position we set, but respect the styling a subtitle file
# asks for. "yes" would throw away signs and karaoke in anime releases.
sub-ass-override=scale

# --- Cache ---------------------------------------------------------------
# Deliberately large, tuned for playing files over a network share rather
# than off local disk. On a slow link a stall is a network hiccup rather than
# a disk one, and the only real defence is reading further ahead. Shrink these
# three if everything you play is local.
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB
demuxer-readahead-secs=30

# --- Screenshots ---------------------------------------------------------
screenshot-format=png
screenshot-high-bit-depth=yes
screenshot-directory=~~desktop/

# --- Resume --------------------------------------------------------------
save-position-on-quit=yes
# Resume the POSITION but not the track choices - otherwise picking a
# subtitle track once pins it for that file forever, which is baffling later.
watch-later-options-remove=vid,aid,sid

# --- uosc ----------------------------------------------------------------
# uosc replaces mpv's built-in on-screen controller, so the built-in one has
# to be off or you get both. border=no lets uosc draw its own window controls
# and title bar; drop that line if you would rather keep the native frame.
osc=no
osd-bar=no
border=no
