# ============================================================
# autoload.conf - managed by windows/bootstrap.ps1
# ============================================================
# Edit this file in the repo, not %APPDATA%\mpv\script-opts\ - the next
# bootstrap run overwrites the deployed copy. A config found in place WITHOUT
# the "managed by" line above is treated as hand-written and copied to .bak
# first.
#
# Option names below are autoload.lua's own, taken from the pinned commit in
# packages.psd1. Adding one it does not recognise is silently ignored, so
# check the script's header comment before inventing a key.

# --- What counts as a playlist entry -------------------------------------
videos=yes
audio=yes
# Screenshots land on the Desktop, but any folder that happens to hold both
# artwork and video would otherwise queue the artwork between episodes.
images=no

# Only pull in files of the same type as the one actually opened. Without
# this, opening an episode in a folder that also holds a soundtrack queues the
# soundtrack after it.
same_type=yes

# --- What to leave out ---------------------------------------------------
ignore_hidden=yes

# Partial and junk files. These matter most when playing off a network share
# that something else is still writing to, where a download in flight sits in
# the same directory as the finished files. Lua patterns, not globs - `%.` is
# a literal dot and `$` anchors the end.
#   ^[Ss]ample   the sample clip release groups ship alongside the real file
#   %.part$      an incomplete browser or curl download
#   %.!qB$       qBittorrent's in-progress extension
ignore_patterns=^[Ss]ample,%.part$,%.!qB$

# --- Directory handling --------------------------------------------------
# auto: follow into a subdirectory when the playlist runs off the end of the
# current one, which is what makes a multi-season folder play straight
# through. Set to `ignore` to keep every playlist inside one directory.
directory_mode=auto
