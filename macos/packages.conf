# ============================================================
# packages.conf - the manifest bootstrap.sh reads
# ============================================================
# Sourced as bash, not parsed, so it can use arrays and comments freely. Keep
# it declarative: this file says WHAT, bootstrap.sh decides how.
#
# Software is sorted the same way the Windows and Linux manifests sort it - by
# who owns it - because that is the distinction that matters when an update run
# goes wrong:
#
#   FORMULA  command-line software, installed and upgraded by Homebrew
#   CASK     .app bundles, installed by Homebrew into /Applications
#   TOOLS    anything that installs itself into $HOME - empty here, see below
#   MANUAL   reported only; owned by an installer this script will not drive
#
# NOT named GROUPS. That is a bash builtin holding the current user's group
# IDs, so assigning to it silently does nothing and every group name in this
# file becomes a number. The Linux manifest learned that the hard way and
# reported groups called 1000 and 27.

# ------------------------------------------------------------
# Groups
# ------------------------------------------------------------
# GROUP_<name>_GUI=yes marks a group that only makes sense on a Mac somebody
# sits in front of. Unlike Linux, this is NOT auto-detected - see the README:
# every Mac has a window server, so there is nothing honest to probe for. It
# defaults to on, and --no-gui turns it off for a headless build agent.
PKG_GROUPS=(shell cli dev infra cloud apps)

# --- shell ---------------------------------------------------------------
GROUP_shell_DESC="Shell, prompt and the tools a login needs"
GROUP_shell_GUI=no
# No zsh here on purpose. macOS has shipped zsh as the default login shell
# since Catalina, and installing Homebrew's alongside it gives you a second zsh
# that a login shell will not use unless you also run chsh - which this script
# will not do for you. bootstrap.sh reports the system one instead.
#
# git IS here even though macOS ships it: the Command Line Tools copy lags well
# behind, and git is not keg-only, so Homebrew's does shadow /usr/bin/git and a
# `brew upgrade` moves the git you actually type.
#
# curl is NOT here, and that is the same fact read the other way. Homebrew marks
# it keg_only :provided_by_macos, so it is never linked into <prefix>/bin -
# installing it leaves a newer curl in <prefix>/opt/curl/bin that nothing on
# PATH ever reaches, and `curl` stays the system one. Adding that directory to
# PATH would buy an OpenSSL backend instead of SecureTransport, and HTTP/3; if
# a machine ever needs either, that is a deliberate fragment change, not a line
# in this array. wget below has no system copy to lose to, so it stays.
#
# The zsh theme and the four add-on plugins are formulae too, not git clones
# into oh-my-zsh's custom directory. Homebrew carries all of them, so brew
# owns their versions like everything else here.
#
# oh-my-zsh itself is the one exception in this file, and not by choice: there
# is no formula for it, so the framework is still installed by its own script.
# Everything that plugs INTO it comes from brew.
#
# The consequence is in the fragment rather than here. oh-my-zsh only loads
# plugins from $ZSH_CUSTOM/plugins/<name>/, and brew installs to
# <prefix>/share/<name>/ - so these are NOT named in ZSH_PLUGINS below. They
# are sourced by path, in an order the fragment has to get right by hand.
GROUP_shell_FORMULA=(
  git
  git-lfs
  wget
  gnupg
  coreutils
  powerlevel10k
  zsh-autosuggestions
  zsh-completions
  zsh-syntax-highlighting
  zsh-history-substring-search
  fzf-tab
)
# The font powerlevel10k needs, and Meslo to match what the Windows manifest
# installs, so a prompt looks the same on both. Without a Nerd Font the prompt
# is not merely plain - it is boxes, because p10k draws from the private-use
# area. Nerd fonts moved into homebrew/cask in 2024, so this needs no tap.
#
# In the shell group rather than a desktop one, unlike the Linux side, which
# gates its font on having a desktop. The glyphs are rendered by the terminal
# you type at, so a font on a headless machine changes nothing - but a headless
# Mac is a rare enough animal that gating for it costs more clarity than the
# 10MB it would save. Headless Debian servers are the common case, hence the
# difference.
GROUP_shell_CASK=(font-meslo-lg-nerd-font)

# --- cli -----------------------------------------------------------------
GROUP_cli_DESC="Modern CLI bundle - nicer cat, ls, find and grep"
GROUP_cli_GUI=no
# Deliberately the same bundle as the Windows and Linux sides, so muscle memory
# transfers between the three shells.
#
# Unlike Debian, Homebrew does NOT rename these: fd is `fd` and bat is `bat`,
# not fdfind and batcat. The managed zsh fragment still guards every alias on
# `command -v`, because the same fragment has to work on a machine where one
# of these failed to install.
#
# Dropped from the Linux list because they are Linux-only: cifs-utils (macOS
# mounts SMB in Finder and with mount_smbfs) and exfatprogs (kernel support is
# built in). p7zip is replaced by `sevenzip`, its maintained successor, and
# unzip is already in the base system.
GROUP_cli_FORMULA=(
  bat
  eza
  fd
  ripgrep
  zoxide
  fzf
  jq
  yq
  sevenzip
  yt-dlp
  ffmpeg
  btop
  tree
  vim
  tmux
  procs
  dust
  duf
  glow
  # Interactive JSON viewer/processor. macOS only: no winget package and not
  # in the Debian archive, so linux/windows skip it for now - see
  # tools/cli-parity.conf.
  fx
)
GROUP_cli_CASK=()

# --- dev -----------------------------------------------------------------
GROUP_dev_DESC="Runtimes, toolchains and build dependencies"
GROUP_dev_GUI=no
# `make` installs as `gmake`, and that is half the reason it is listed. macOS
# ships BSD make as /usr/bin/make and Homebrew will not shadow it, so GNU make
# arrives under a different name. This is the macOS counterpart to Debian's
# fdfind/batcat rename, and the managed zsh fragment handles it the same way.
#
# The tail from openssl@3 onward is not padding - it is what pyenv needs to
# BUILD a Python here, and it is a different list from the Linux one because
# the system provides different pieces. Without it `pyenv install` fails late,
# in a compiler error that says nothing about a missing header.
#
# The four version managers are Homebrew formulae here, NOT git clones under
# $HOME the way the Linux manifest installs them. That is a deliberate split
# and it costs something worth naming: $HOME/.pyenv is the same path on both
# platforms, so the two managed zsh fragments used to be able to say the same
# thing about it, and now they cannot.
#
# What it buys is that brew owns them. They are version-checked, upgraded and
# reported by the phase that already does that for every other package, rather
# than by a clone-and-pull phase with its own notion of what "current" means -
# and `brew upgrade` is one transaction instead of four `git pull`s that can
# each fail differently. On Linux there is no such option; here there is.
GROUP_dev_FORMULA=(
  python3
  node
  go
  gh
  shellcheck
  make
  pyenv
  pyenv-virtualenv
  # tofuenv, not tfenv: manages OpenTofu, the open fork Terraform's BSL
  # relicensing and IBM acquisition pushed this manifest towards. `tofu` on
  # PATH instead of `terraform`; tflint/terraform-docs below are unaffected.
  tofuenv
  # Homebrew's nvm needs more care than the other three, and the fragment
  # handles it - see the nvm section in bootstrap.sh. Two facts drive it, both
  # from Homebrew's own caveat: upstream considers a brew-managed nvm
  # unsupported, and leaving NVM_DIR pointing at the Cellar "will destroy any
  # nvm-installed Node installations upon upgrade/reinstall".
  nvm
  openssl@3
  readline
  sqlite3
  xz
  zlib
  tcl-tk
  libffi
)
# Temurin rather than the `openjdk` formula. openjdk is keg-only on macOS: it
# installs where /usr/libexec/java_home cannot see it, and Homebrew's own
# caveat tells you to finish the job with a sudo symlink into
# /Library/Java/JavaVirtualMachines. The cask puts a real JDK bundle where
# every Java launcher on the machine already looks.
#
# dotnet-sdk is a cask because it ships as Microsoft's own .pkg. It drops the
# SDK in /usr/local/share/dotnet and links `dotnet` and `dnx` from there, which
# is already on PATH - so unlike the $HOME install this replaced, it needs
# nothing at all from the zsh fragment.
GROUP_dev_CASK=(temurin claude-code dotnet-sdk)

# --- infra ---------------------------------------------------------------
GROUP_infra_DESC="Configuration management and linting"
GROUP_infra_GUI=no
# Ansible itself is deliberately NOT here - it is installed per project into a
# virtualenv, where the version is a decision the playbook repository makes
# rather than one Homebrew makes for every project on the machine at once.
# (The Linux manifest does install it from the distribution: there it is the
# control node for a fleet, which is a different job.)
#
# ansible-lint is still listed, and it is worth knowing that it depends on
# ansible-core - so Homebrew pulls a copy of Ansible in behind it anyway. That
# copy lives in the brew prefix and does not shadow a virtualenv, which is why
# it is left here; drop this line too if you want brew to stay clear of Ansible
# entirely and run the linter out of the same virtualenv.
GROUP_infra_FORMULA=(
  ansible-lint
  yamllint
  pre-commit
  # tflint comes from the terraform-linters tap declared in TAPS at the bottom
  # of this file. It is NOT in homebrew-core - `brew install tflint` on a Mac
  # with no tap fails with "No available formula", which is why the tap is not
  # optional here the way an empty TAPS list would suggest.
  tflint
  terraform-docs
)
GROUP_infra_CASK=()

# --- cloud ---------------------------------------------------------------
GROUP_cloud_DESC="Cloud and Kubernetes CLIs"
GROUP_cloud_GUI=no
# kubernetes-cli is the formula that provides `kubectl`; there is no formula
# called kubectl. Homebrew's `awscli` is v2 - the v1 line is long gone from
# core, so no version suffix is needed here the way it is on Linux.
GROUP_cloud_FORMULA=(
  kubernetes-cli
  helm
  k9s
  stern
  awscli
  azure-cli
)
# `gcloud-cli`, and it is a CASK rather than a formula. Two renames are folded
# into that one line, both of which break an install rather than degrade it:
# it was a formula before Homebrew moved it, because it ships a bundled Python
# and its own component updater rather than being a single binary brew can
# version; and the cask itself was then renamed from `google-cloud-sdk`, which
# no longer exists. Checked against the Homebrew index by verify-manifests.yml,
# which is how the stale name was found.
GROUP_cloud_CASK=(gcloud-cli)

# --- apps ----------------------------------------------------------------
GROUP_apps_DESC="Everyday desktop applications"
GROUP_apps_GUI=yes
GROUP_apps_FORMULA=()
# Every cask here needs a Mac somebody sits at, which is what GUI=yes above
# says and why the whole group is one gate. The groups are kept homogeneous on
# purpose: the flag skips the GROUP, so a mixed group would take yamllint down
# with Docker Desktop on a headless agent.
#
#
# `docker-desktop`, not `docker`. There is also a `docker` FORMULA and it is
# the CLI client on its own with no engine behind it, so installing that when
# you wanted Docker Desktop leaves you with a working `docker` command that
# cannot reach a daemon. bootstrap.sh looks formulae and casks up separately
# for exactly this reason. On a headless agent, use colima instead - it is
# reported under MANUAL at the bottom of this file.
#
# Check a cask token against `old_tokens` before adding it here, and prefer the
# current one. Homebrew renames casks and keeps the old name resolving for a
# while, which is worse than it sounds in both directions: `brew install --cask
# <old>` can fail outright once the alias is dropped, and while it still works
# it installs a SECOND copy that `brew list` shows under a name this file never
# mentions. `gcloud-cli` was `google-cloud-sdk`, and mpv's cask went the same
# way. The release workflow checks this - see the old_tokens error in
# .github/workflows/verify-manifests.yml - so a stale token fails CI rather
# than the machine.
GROUP_apps_CASK=(
  # Ghostty over iTerm2, and the reason is the thing this repository cares
  # about: its config is a plain text file that could be managed the same way
  # the zsh fragment is, while iTerm2 keeps its settings in a plist. The old
  # caveat about SSH - ghostty sets TERM=xterm-ghostty, which a Debian box
  # that has never heard of it will complain about - is handled below in the
  # ghostty config by `ssh-env,ssh-terminfo` in the shell integration
  # features. First connection to a new host installs the terminfo entry
  # under that user's ~/.terminfo; subsequent ones cost nothing.
  ghostty
  visual-studio-code
  docker-desktop
  vlc
  obsidian
  # API client. Bruno over Postman: collections are plain-text files that
  # diff in git, not a vendor account.
  bruno
  # DB client. DBeaver Community - fully open source, not a free tier of a
  # paid app like TablePlus.
  dbeaver-community
)

# ------------------------------------------------------------
# Tools that install themselves into $HOME
# ------------------------------------------------------------
# EMPTY on macOS, and that is the whole difference from the Linux manifest.
# pyenv, pyenv-virtualenv, tofuenv and nvm used to be git clones here; they
# are Homebrew formulae in the dev group now, where brew version-checks and
# upgrades them alongside everything else.
#
# The variable stays because bootstrap.sh reads it and the release workflow
# checks it exists - and because an empty array is the honest way to say "this
# category has no members here", which is different from the category not
# applying. Anything that genuinely has no formula and installs itself into
# $HOME still belongs in this list.
#
# Nothing uninstalls the old clones. A Mac that ran an earlier version still
# has ~/.pyenv, ~/.tfenv and ~/.nvm on disk, and ~/.pyenv is still where brew's
# pyenv keeps its data, so leaving it is correct rather than merely harmless.
# ~/.tfenv is genuinely dead now too and can be removed by hand.
TOOLS=()

# ------------------------------------------------------------
# zsh
# ------------------------------------------------------------
# oh-my-zsh with powerlevel10k, matching the Linux manifest and the fleet's zsh
# role, so the shell is the same on every machine that gets one.
#
# Order matters in ZSH_PLUGINS, not just membership. zsh-syntax-highlighting
# must be the LAST plugin oh-my-zsh sources except one: it wraps ZLE widgets to
# add highlighting, and any plugin loaded after it defines its widgets outside
# that wrapping, so their output goes unhighlighted. history-substring-search
# is the documented exception and must come after it. fzf-tab has the opposite
# constraint - after compinit, which oh-my-zsh runs before sourcing plugins,
# but before anything that wraps ZLE widgets - so first is the only position
# that satisfies it.
#
# Two differences from the Linux list, both because of the platform:
#   command-not-found is dropped - it wraps Debian's handler, which does not
#   exist here, and on macOS it loads and silently does nothing.
#   macos is added - it is the bundled plugin for `ofd`, `pfd`, `quick-look`
#   and the rest, and there is no Linux equivalent to keep in step with.
ZSH_ENABLED=yes
# EMPTY, and that is not an oversight. powerlevel10k is a Homebrew formula now
# rather than a clone in oh-my-zsh's custom themes directory, so oh-my-zsh
# cannot find it by name - it looks only under $ZSH_CUSTOM/themes. Naming it
# here would make oh-my-zsh print "theme not found" and fall back to its
# default. The fragment sources the theme from the brew prefix instead, after
# oh-my-zsh.sh, exactly as Homebrew's own caveat for the formula says to.
ZSH_THEME=""
# ONLY the plugins oh-my-zsh ships with itself. Everything that used to be
# cloned into the custom directory - fzf-tab, zsh-autosuggestions,
# zsh-completions, zsh-syntax-highlighting, history-substring-search - is a
# Homebrew formula now and is sourced by path in the fragment.
#
# They cannot be listed here AND come from brew: `plugins=(...)` resolves a
# name against oh-my-zsh's own directories and nothing else, so a name here
# that brew installed to <prefix>/share is simply not found. That is why the
# ordering rules those plugins have moved into the fragment with them.
ZSH_PLUGINS=(
  git
  extract
  docker-compose
  docker
  golang
  jsontools
  pip
  virtualenv
  gitignore
  pyenv
  # NO nvm plugin here, unlike the Linux list, and removing it is what keeps
  # nvm working rather than a simplification.
  #
  # The plugin only falls back to a Homebrew nvm when NVM_DIR is EMPTY, and
  # when it does, it sets NVM_DIR to the Cellar path - which is precisely the
  # configuration Homebrew's own caveat says "will destroy any nvm-installed
  # Node installations upon upgrade/reinstall". Set NVM_DIR correctly instead
  # and the plugin finds no nvm.sh there and silently does nothing.
  #
  # So the fragment does the job itself: NVM_DIR at ~/.nvm for the data, nvm.sh
  # sourced from the brew prefix, and the same lazy loading the plugin gave us,
  # written out explicitly. See the nvm section in bootstrap.sh.
  fzf
  macos
)

# EMPTY on macOS. Every one of these is a Homebrew formula in the shell group
# now, so nothing is cloned into oh-my-zsh's custom directory at all.
#
# The variable stays because bootstrap.sh reads it and the release workflow
# checks it exists - and because the category still applies in principle: an
# oh-my-zsh plugin with no formula would still belong here. The Linux manifest
# still uses it for exactly that reason.
#
# Nothing removes the old clones. A Mac that ran an earlier version still has
# them under ~/.oh-my-zsh/custom, where they are now dead weight rather than a
# conflict - they are no longer named in ZSH_PLUGINS, so nothing sources them.
# Delete ~/.oh-my-zsh/custom/plugins and ~/.oh-my-zsh/custom/themes by hand if
# you want them gone.
ZSH_CUSTOM_PLUGINS=()

# ------------------------------------------------------------
# Terminal config
# ------------------------------------------------------------
# The reason ghostty was chosen over the alternatives: its config is a plain
# text file, so this script can manage it the same way it manages the zsh
# fragment - written, compared, and reported as `current` when nothing moved.
#
# scrollback-limit is in BYTES, and there is no unlimited setting. Ghostty says
# so itself: "It is not currently possible to set an unlimited scrollback
# buffer. This is a future planned feature."
#
# 256MB, and the number is chosen against two facts from the same docs. It is
# PER TERMINAL SURFACE, not per application - every tab and every split gets
# its own - and the buffer lives entirely in RAM. It is a cap rather than a
# preallocation, so an idle tab costs nothing, but a runaway process in a
# handful of splits can reach the whole of it. 256MB is far more than a large
# terraform plan produces and still bounded if something goes wrong.
#
# Worth being clear about what this does and does not do. Scrollback is a RAM
# buffer belonging to one window: close the window and it is gone, and it is
# never written anywhere. If the goal is "every command I ran is still there
# tomorrow", that is SHELL HISTORY, configured in the zsh section below - the
# two solve different halves and you want both.
GHOSTTY_ENABLED=yes
GHOSTTY_SCROLLBACK_BYTES=268435456

# The theme is a name ghostty already ships - `ghostty +list-themes` prints
# 463 of them - so this is a filename match, not a palette this manifest owns.
# Catppuccin Mocha is the widely used dark default across dev tooling in 2026;
# swap the name to any other row from that list to change palette without any
# other edit here. Ghostty also accepts `dark:X,light:Y` to auto-switch with
# the OS appearance - drop that form in as the value if that is wanted.
GHOSTTY_THEME="Catppuccin Mocha"

# The Meslo Nerd Font the manifest already installs, matched by its
# PostScript/family name rather than by the filename. The value here has to
# be `MesloLGM Nerd Font Mono` and not `MesloLGMNerdFont` (the ttf naming) -
# ghostty reads the installed face table, and that table names it with the
# spaces. Change this alongside NERD_FONT_MATCH above or the two disagree.
# Empty falls back to SF Mono on macOS.
GHOSTTY_FONT_FAMILY="MesloLGM Nerd Font Mono"

# 16pt, matching the iTerm2 profile this manifest replaces. Ghostty's default
# is 13pt, which is visibly smaller than the macOS system font on a Retina
# display; 16pt is the size a normal seating distance is comfortable at.
GHOSTTY_FONT_SIZE=16

# Option is Meta, so Option-f/b/arrows produce the escape sequences zsh, vim
# and readline recognise as word-wise motion. macOS's default reverses this to
# keep the OS-level "typographic" bindings (Option-e for é, and the rest);
# that half is genuinely used by nobody at a terminal, and the shortcut half
# is used by everyone. `left` and `right` are also valid if only one side of
# the keyboard should be Meta.
GHOSTTY_MACOS_OPTION_AS_ALT=true

# Restore tabs and splits across a relaunch. The default is `default`, which
# only restores when the OS asks - a login-item restart, or a reboot with
# "Reopen windows" ticked - and drops the state on a plain Cmd-Q. `always`
# covers the quit-and-relaunch-by-hand case too, which is the one a tmux user
# would have covered with a persistent session and everyone else loses.
GHOSTTY_WINDOW_SAVE_STATE=always

# Select-to-copy: highlighting text puts it on the clipboard Cmd-V pastes
# from. The value has to be `clipboard` and not `true` - `true` copies to the
# X11-style *primary selection*, which on macOS is a separate buffer nothing
# reaches with Cmd-V and is only pastable via Cmd-Shift-V. Ghostty documents
# both values as valid but they mean different things; the intuitive one is
# `clipboard`. Set to `false` to disable.
GHOSTTY_COPY_ON_SELECT=clipboard

# End the app when the last window closes, matching the CLI-tool convention.
# macOS's default is to keep the process alive with no visible window - right
# for a mail client, wrong for a terminal, because the Dock icon lingers and
# Cmd-Q is the only way out.
GHOSTTY_QUIT_AFTER_LAST_WINDOW=true

# Ghostty auto-installs the shell hooks; this list opts INTO the extra
# behaviours those hooks provide.
#   cursor       - follows zsh vi-mode with a bar/block change.
#   sudo         - preserves TERM/TERMINFO through sudo, so colours and
#                  shell integration survive `sudo -i`.
#   title        - keeps the terminal title tracking cwd.
#   ssh-env      - carries ghostty's env (TERM=xterm-ghostty, COLORTERM=
#                  truecolor) through ssh, so the remote shell sees what
#                  the local one does. Adding this WITHOUT ssh-terminfo
#                  breaks curses apps on any host that does not already
#                  have the xterm-ghostty terminfo entry - which is most
#                  of them, so the two go together.
#   ssh-terminfo - on first ssh to a new host, pipes `infocmp -x
#                  xterm-ghostty` through `tic -x -` on the remote,
#                  installing the terminfo entry under the remote user's
#                  ~/.terminfo. Cached locally afterwards, so a repeat
#                  connection costs nothing. Requires `tic` on the remote
#                  (part of ncurses; on every Linux, macOS and BSD).
# Set to the empty string to opt out of all five and leave only the base
# hooks.
GHOSTTY_SHELL_INTEGRATION_FEATURES="cursor,sudo,title,ssh-env,ssh-terminfo"

# Quake-style drop-down terminal, summoned from anywhere on the system with
# one hotkey - including from inside full-screen apps. Cmd-\` toggles it;
# `global:` scopes the binding to the OS rather than to a ghostty window, so
# it works when ghostty is not focused. Set to the empty string to disable
# the binding entirely and free the shortcut.
GHOSTTY_QUICK_TERMINAL_KEYBIND="global:cmd+grave_accent=toggle_quick_terminal"

# Padding between the terminal content and the window edge. Ghostty's default
# is 2/2 - visually cramped at 16pt, especially at the left edge where a bare
# `%` prompt lives right against the frame. 10/10 gives it room to breathe.
GHOSTTY_WINDOW_PADDING_X=10
GHOSTTY_WINDOW_PADDING_Y=10

# ------------------------------------------------------------
# Shell history
# ------------------------------------------------------------
# This is the half that actually persists. zsh's own defaults are small and
# lossy, and oh-my-zsh only nudges them - so without this a busy week silently
# drops the command you wanted.
#
# HISTSIZE is what the running shell keeps in memory; SAVEHIST is what reaches
# the file. SAVEHIST must not be smaller than HISTSIZE or the file is truncated
# on every exit, which is the classic way to lose history while believing it is
# being kept.
HISTORY_SIZE=1000000
HISTORY_FILE_SIZE=1000000

# ------------------------------------------------------------
# Held
# ------------------------------------------------------------
# Neither installed nor upgraded; reported as `held` so it stays visible rather
# than quietly absent. Format: "name:reason".
HELD=()

# ------------------------------------------------------------
# Taps
# ------------------------------------------------------------
# Homebrew's answer to a third-party apt repository, and empty for the same
# reason the Linux REPOS list is short: on macOS almost nothing needs one any
# more. homebrew/core and homebrew/cask are built in, and every name in the
# groups above comes from them.
#
# Understand what a tap is before adding one. It is a git repository of build
# recipes, and once tapped it can define what `brew install <name>` does - the
# same class of decision as trusting an apt signing key, even though it looks
# like a one-word command. Format: "user/repo:description".
#
# ONE tap, and it is not optional: tflint is not in homebrew-core, so the entry
# in the infra group above fails with "No available formula" without it. This
# is the upstream project's own tap, which is the same standard the Linux
# REPOS list holds a vendor repository to.
#
# Worth noting what it does NOT buy, because the asymmetry is the interesting
# part. On Linux tflint is a RELEASES entry - a single static binary, no key,
# no repository, nothing that can push anything later. macOS has no equivalent
# phase, so the tap is the price of the same tool here.
TAPS=(
  "terraform-linters/tap:tflint - not in homebrew-core, and the infra group needs it"
)

# ------------------------------------------------------------
# Manual
# ------------------------------------------------------------
# Still detected and reported, never installed - for anything owned by an
# installer this script will not drive. Format is "command:name:where-to-get-it".
#
# Xcode's Command Line Tools are not listed here because they are not optional:
# Homebrew cannot build anything without them, so bootstrap.sh checks for them
# in preflight rather than mentioning them at the end.
MANUAL=(
  "mas:Mac App Store CLI:brew install mas - needed for anything only on the App Store"
  "colima:Colima:brew install colima - a headless container runtime, if you skip Docker Desktop"
)
