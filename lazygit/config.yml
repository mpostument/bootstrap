# config.yml - lazygit's config, managed by the bootstrap on every platform.
#
# Unlike k9s and btop, lazygit has no separate theme file: its colours live in
# the one config file, under gui.theme. So this whole file is the repo's, and a
# run replaces a copy that has drifted from it - the first replacement is kept
# as config.yml.bak. Settings of your own belong here, in the repo, where all
# three machines get them.
#
# The palette is Catppuccin Mocha, the same one starship.toml, the bat theme,
# the atuin theme, the k9s skin and the ghostty config use. Colours from
# catppuccin/lazygit (MIT).
# Back in lazygit as soon as an editor or custom command exits, without the
# "press enter to return" pause lazygit adds by default.
promptToReturnFromSubprocess: false

gui:
  # File-type icons in the files and commit-files panels, like eza's and
  # yazi's. Every platform's bootstrap installs a Meslo Nerd Font (v3) and
  # points the terminal at it; lazygit ships this off.
  nerdFontsVersion: '3'

  # The branches panel shows how far each branch is behind main (and ahead),
  # so a branch that needs a rebase is visible without checking out main.
  # lazygit ships this as none.
  showDivergenceFromBaseBranch: arrowAndNumber

  # +12 -3 beside each file in the files panel. Off by default.
  showNumstatInFilesView: true

  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    # Under theme since lazygit 0.66, which otherwise moves it here itself and
    # rewrites the file on every start - drift the next run would undo.
    authorColors:
      '*': '#b4befe'
