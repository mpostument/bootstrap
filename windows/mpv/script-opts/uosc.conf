# ============================================================
# uosc.conf - managed by windows/bootstrap.ps1
# ============================================================
# Edit this file in the repo, not %APPDATA%\mpv\script-opts\ - the next
# bootstrap run overwrites the deployed copy. A config found in place WITHOUT
# the "managed by" line above is treated as hand-written and copied to .bak
# first.
#
# Only the keys set here change; every other uosc option keeps its default.
# Element syntax is uosc's own - see the header of uosc.conf in the release
# that packages.psd1 installs.

# uosc's default bar, plus a pin button before fullscreen that toggles mpv's
# `ontop` property: the window stays above every other one. Shift+T does the
# same from the keyboard, and the menu has it under "Always on top".
# ontop-playback.lua unpins the window while paused and pins it again on play.
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,gap,space,<video,audio>speed,space,shuffle,loop-playlist,loop-file,gap,prev,items,next,gap,toggle:push_pin:ontop?Always on top,fullscreen
