# ============================================================
# packages.conf - the manifest bootstrap.sh reads
# ============================================================
# Sourced as bash, not parsed, so it can use arrays and comments freely. Keep
# it declarative: this file says WHAT, bootstrap.sh decides how.
#
# Software is sorted the same way the Windows manifest sorts it - by who owns
# it - because that is the distinction that matters when an update run goes
# wrong:
#
#   APT      installed and upgraded from the distribution's own repositories
#   FLATPAK  installed and upgraded from Flathub
#   TOOLS    version managers and SDKs that install themselves into $HOME
#   MANUAL   reported only; needs a vendor repository this script will not add
#
# The last category is not laziness. Adding a third-party apt repository means
# trusting a signing key and letting that vendor push packages to this machine
# forever, which is a decision to make by hand and not a line in a loop.
#
# NOT named GROUPS. That is a bash builtin holding the current user's group
# IDs, so assigning to it silently does nothing and every group name in this
# file becomes a number. Measured, not theorised: the first version of this
# manifest did exactly that and the run reported groups called 1000 and 27.

# ------------------------------------------------------------
# Groups
# ------------------------------------------------------------
# GROUP_<name>_GUI=yes marks a group that needs a desktop. On a machine with no
# desktop environment those groups are reported as `no-gui` and skipped, which
# is the whole reason a server and a workstation can share one manifest.
PKG_GROUPS=(shell cli dev infra creative apps)

# --- shell ---------------------------------------------------------------
GROUP_shell_DESC="Shell, prompt and the tools a login needs"
GROUP_shell_GUI=no
# flatpak here rather than in a desktop group: installing it is cheap, and the
# apps group cannot install anything from Flathub without it. bootstrap.sh adds
# the flathub remote itself once the binary exists.
GROUP_shell_APT=(zsh git git-lfs curl wget ca-certificates gnupg apt-transport-https flatpak)
GROUP_shell_FLATPAK=()

# --- cli -----------------------------------------------------------------
GROUP_cli_DESC="Modern CLI bundle - nicer cat, ls, find and grep"
GROUP_cli_GUI=no
# Deliberately the same bundle as the Windows side, so muscle memory transfers
# between the two shells. Debian renames two of these binaries to dodge a clash
# with older archive packages: fd-find installs as `fdfind` and bat as
# `batcat`. Both renames are long-standing and stable across releases; the
# managed .zshrc aliases them and guards each on `command -v` first.
#
# eza is not in every Debian release's archive - it is missing on bookworm and
# present on trixie. bootstrap.sh reports a package the release does not carry
# as `missing` rather than failing the run.
#
# yq is deliberately NOT in this list, even though Debian packages something
# called yq. It is a different program from the one the other two platforms
# install - see the RELEASES section at the bottom of this file, which takes
# the real one as a static binary instead.
GROUP_cli_APT=(
  bat
  eza
  fd-find
  ripgrep
  zoxide
  fzf
  jq
  p7zip-full
  yt-dlp
  ffmpeg
  btop
  tree
  unzip
  vim
  tmux
  cifs-utils
  exfatprogs
)
GROUP_cli_FLATPAK=()

# --- dev -----------------------------------------------------------------
GROUP_dev_DESC="Runtimes, toolchains and build dependencies"
GROUP_dev_GUI=no
# Node and the system Python come from the distribution. Whatever the release
# ships is a version somebody else is already patching; per-project versions
# are what pyenv below is for, rather than fighting the archive.
#
# The long tail from libssl-dev onward is not padding - it is exactly what
# pyenv needs to BUILD a Python. Without it `pyenv install` fails late, in a
# compiler error that says nothing about a missing header.
GROUP_dev_APT=(
  python3
  python3-pip
  python3-venv
  nodejs
  npm
  golang-go
  default-jdk
  gh
  shellcheck
  make
  build-essential
  libssl-dev
  zlib1g-dev
  libbz2-dev
  libreadline-dev
  libsqlite3-dev
  llvm
  libncurses-dev
  xz-utils
  tk-dev
  libffi-dev
  liblzma-dev
)
GROUP_dev_FLATPAK=()

# --- infra ---------------------------------------------------------------
GROUP_infra_DESC="Configuration management and linting"
GROUP_infra_GUI=no
# Ansible from the distribution rather than pip: it is the control node for a
# fleet, and a system package that the distribution patches is the right shape
# for that. The linters are here because they are what the fleet repository's
# pre-commit hooks call.
GROUP_infra_APT=(
  ansible
  ansible-lint
  yamllint
  pre-commit
)
GROUP_infra_FLATPAK=()

# --- creative ------------------------------------------------------------
GROUP_creative_DESC="3D, 2D and capture tooling"
GROUP_creative_GUI=yes
# Blender from Flathub rather than apt on purpose: the distribution package is
# routinely a major version behind, and this is exactly the kind of software
# where that matters. Everything here needs a desktop, which is what
# GROUP_creative_GUI=yes above says.
GROUP_creative_APT=(inkscape obs-studio)
# GIMP from Flathub for the same reason as Blender, and the numbers say it
# rather than the principle: trixie ships 3.0.4 and Flathub is on 3.2.4, a
# whole minor series ahead. Debian stable then FREEZES - trixie will still be
# on the 3.0 line in two years, taking security fixes and nothing else - so
# this is not a gap that closes, it is one that widens for the life of the
# release. Bookworm is worse again at 2.10.34, a major version behind.
#
# Nothing here uninstalls, so a machine that ran an earlier manifest keeps
# Debian's gimp at /usr/bin/gimp and will now have BOTH, with two entries in
# the desktop menu and `gimp` at a prompt still running the apt one. That is
# the one case in this file where leaving the old copy is untidy rather than
# harmless: `sudo apt remove gimp` finishes the move.
GROUP_creative_FLATPAK=(org.blender.Blender org.gimp.GIMP)

# --- apps ----------------------------------------------------------------
GROUP_apps_DESC="Everyday desktop applications"
GROUP_apps_GUI=yes
# ghostty is in Ubuntu 26.04 and later, and is NOT in the Debian archive at
# all - so on Debian this reports `missing` and the run carries on, the same
# way eza does on bookworm. There is a community .deb and this manifest will
# not install it: a terminal emulator is not worth a third-party repository.
GROUP_apps_APT=(vlc mpv qbittorrent ghostty)
# Zoom from Flathub: it is not in the Debian archive, and its own .deb is a
# direct download with no repository behind it, so Flathub is the only one
# of the three that gets updated by a normal run.
GROUP_apps_FLATPAK=(md.obsidian.Obsidian org.telegram.desktop us.zoom.Zoom)

# ------------------------------------------------------------
# Tools that install themselves into $HOME
# ------------------------------------------------------------
# The version managers, as git clones under $HOME. No root, no third-party apt
# key, and nothing system-wide to conflict with what the platform's own package
# manager ships.
#
# One per language, which is the trade this makes deliberately. A single tool
# covering all three exists, and the cost of three is three shell hooks and
# three things to update; the benefit is that each is the mature, widely
# documented answer for its own language, and a problem with one cannot take
# the other two down with it.
#
# THE DISTRIBUTION ALSO SHIPS PYTHON AND NODE, and that is fine rather than a
# conflict. Those are what system tooling links against and what runs when no
# project says otherwise. These three prepend to PATH, so a project pin wins
# whenever there is one - which is the whole point of having them.
#
# Order matters: pyenv-virtualenv is a pyenv PLUGIN and clones into pyenv's own
# plugins directory, so it only makes sense once pyenv is there. bootstrap.sh
# installs them in the order listed for that reason.
#
# Deliberately UNPINNED, tracking each upstream's default branch. Same call as
# the zsh plugins: this is a personal machine somebody uses interactively,
# where staying current beats reproducibility.
TOOL_pyenv_DESC="Python version manager"
TOOL_pyenv_DIR="${HOME}/.pyenv"
TOOL_pyenv_REPO="https://github.com/pyenv/pyenv.git"

TOOL_pyenv_virtualenv_DESC="pyenv virtualenv plugin"
TOOL_pyenv_virtualenv_DIR="${HOME}/.pyenv/plugins/pyenv-virtualenv"
TOOL_pyenv_virtualenv_REPO="https://github.com/pyenv/pyenv-virtualenv.git"

TOOL_tfenv_DESC="Terraform version manager"
TOOL_tfenv_DIR="${HOME}/.tfenv"
TOOL_tfenv_REPO="https://github.com/tfutils/tfenv.git"

# nvm is a shell FUNCTION, not a binary - `nvm use` has to change the PATH of
# the shell you are sitting in, which nothing external can do. That is why it
# is sourced rather than put on PATH like the other two, and why it is slow:
# the script it sources is large, and doing it on every prompt is the usual
# reason a zsh startup goes from instant to noticeably not. The managed
# fragment loads it LAZILY through oh-my-zsh for exactly that reason.
TOOL_nvm_DESC="Node version manager"
TOOL_nvm_DIR="${HOME}/.nvm"
TOOL_nvm_REPO="https://github.com/nvm-sh/nvm.git"

TOOLS=(pyenv pyenv_virtualenv tfenv nvm)

# --- Claude Code ---------------------------------------------------------
# Anthropic's own installer script, which drops a single binary into
# ~/.local/bin. Not npm: the native build needs no Node on PATH and does not
# care which version nvm happens to be pointing at.
#
# Installed once and then LEFT ALONE. Claude Code updates itself, so a script
# that reinstalled it on every run would be the second installer in a fight it
# cannot win - the same reason this tool does not touch a Flatpak's own updater
# or a JetBrains Toolbox install on Windows. After the first run it is reported
# as `present`, with the version it has decided it is on.
CLAUDE_CODE_ENABLED=yes
CLAUDE_CODE_INSTALLER="https://claude.ai/install.sh"

# --- AWS CLI v2 ----------------------------------------------------------
# v2 specifically, and that is why this is a phase of its own rather than a
# line in a group. Debian packages `awscli`, but it is v1 - a different major
# with different defaults and no SSO support worth using. AWS does not publish
# v2 to any apt repository and does not put it on GitHub releases either; the
# only supported route is a zip from their own domain containing an installer.
#
# Into $HOME, like everything else here that comes from a vendor script:
# ~/.local/aws-cli holds it and the `aws` symlink lands in ~/.local/bin next to
# the release binaries.
AWSCLI_ENABLED=yes
AWSCLI_URL="https://awscli.amazonaws.com/awscli-exe-linux-{UNAME_ARCH}.zip"
AWSCLI_DIR="${HOME}/.local/aws-cli"

# --- .NET SDK ------------------------------------------------------------
# Microsoft's own installer script, into $HOME, rather than the packages.
#
# Note the shape this has: dotnet-install.sh installs side by side under
# sdk/<version> rather than replacing, so a channel rollover leaves the
# previous major on disk forever. Old SDKs are reported, never deleted.
DOTNET_ENABLED=yes
# A concrete major, not "LTS". The Windows manifest installs
# Microsoft.DotNet.SDK.10, and the two sides drifting apart is worse than
# either being a release behind - a channel alias would move one of them on its
# own schedule. Bump this and the Windows id together.
DOTNET_CHANNEL="10.0"
DOTNET_DIR="${HOME}/.dotnet"

# ------------------------------------------------------------
# zsh
# ------------------------------------------------------------
# oh-my-zsh with powerlevel10k, matching the fleet's zsh role so the shell is
# the same on every machine that gets one.
#
# Order matters in ZSH_PLUGINS, not just membership. zsh-syntax-highlighting
# must be the LAST plugin oh-my-zsh sources except one: it wraps ZLE widgets to
# add highlighting, and any plugin loaded after it defines its widgets outside
# that wrapping, so their output goes unhighlighted. history-substring-search
# is the documented exception and must come after it. fzf-tab has the opposite
# constraint - after compinit, which oh-my-zsh runs before sourcing plugins,
# but before anything that wraps ZLE widgets - so first is the only position
# that satisfies it.
ZSH_ENABLED=yes
ZSH_THEME="powerlevel10k/powerlevel10k"
ZSH_PLUGINS=(
  fzf-tab
  git
  zsh-autosuggestions
  command-not-found
  extract
  docker-compose
  ansible
  docker
  golang
  jsontools
  pip
  virtualenv
  zsh-completions
  gitignore
  pyenv
  nvm
  fzf
  zsh-syntax-highlighting
  history-substring-search
)

# name|repo, cloned into oh-my-zsh's custom directory. Unpinned, tracking each
# upstream's default branch, for the same reason as TOOLS above.
ZSH_CUSTOM_PLUGINS=(
  "zsh-syntax-highlighting|https://github.com/zsh-users/zsh-syntax-highlighting.git"
  "zsh-autosuggestions|https://github.com/zsh-users/zsh-autosuggestions.git"
  "zsh-completions|https://github.com/zsh-users/zsh-completions.git"
  "fzf-tab|https://github.com/Aloxaf/fzf-tab.git"
)
ZSH_THEME_REPO="https://github.com/romkatv/powerlevel10k.git"

# ------------------------------------------------------------
# Release binaries
# ------------------------------------------------------------
# Single static binaries from a GitHub release, into ~/.local/bin. A third
# category alongside APT and TOOLS, for software that is in neither the Debian
# archive nor a git repository you can just clone and run.
#
# Both entries below are exactly that case: tflint and terraform-docs are not
# packaged by Debian in any release, and both ship a static Go binary. The
# alternatives were a vendor apt repository - a signing key and a standing
# invitation to push packages here forever, for two linters - or `go install`,
# which needs the toolchain and gives no version anybody can read back.
#
# UNLIKE the TOOLS clones, these ARE version-checked on every run: each binary
# reports its own version, the newest release tag is fetched, and the two are
# compared. So a run that changes nothing says `current` and downloads nothing.
#
# Four substitutions are available in an ASSET or URL. {TAG} is the release tag
# and {VERSION} the same thing with any leading `v` stripped - terraform-docs
# puts the version in its own asset filename, so the tag has to be known before
# the download URL can be built, and stern spells it without the `v`.
#
# The other two are the SAME machine under two naming conventions, and upstream
# projects are split about evenly between them: {ARCH} is dpkg
# --print-architecture (amd64, arm64) and {UNAME_ARCH} is uname -m (x86_64,
# aarch64). A manifest entry cannot rename what its upstream chose to call the
# asset, so both words exist here rather than one being converted into the
# other; picking the wrong one produces a confident 404 against a release that
# does exist. Neither is called GOARCH - Go's own GOARCH values are amd64 and
# arm64, the dpkg spelling, so that name would point at the wrong one of the
# two and read as though it settled the question.
#
# A project whose naming matches neither - gitleaks says linux_x64, lazygit
# says Linux_x86_64 - still needs the literal written into its own ASSET line,
# the way k9s already carries its capital L. Two shared words cover the common
# cases; a third convention per upstream is not a vocabulary worth growing.
RELEASES=(tflint terraform_docs helm k9s stern yq)

RELEASE_tflint_DESC="Terraform linter"
RELEASE_tflint_REPO="terraform-linters/tflint"
RELEASE_tflint_BIN="tflint"
RELEASE_tflint_ASSET="tflint_linux_{ARCH}.zip"

RELEASE_terraform_docs_DESC="Terraform documentation generator"
RELEASE_terraform_docs_REPO="terraform-docs/terraform-docs"
RELEASE_terraform_docs_BIN="terraform-docs"
RELEASE_terraform_docs_ASSET="terraform-docs-{TAG}-linux-{ARCH}.tar.gz"

# helm, k9s and stern as release binaries rather than apt repositories. All
# three publish a static Go binary, and taking them this way means three fewer
# vendor signing keys on the machine - see the warning above REPOS about what a
# key actually buys the vendor. kubectl is the exception below, because its apt
# repository is the documented path and is version-pinned in a way that matters.
# helm 4, which is where this currently lands and is the intended major. All
# three platforms agree on it without anything being pinned: winget's Helm.Helm
# and Homebrew's helm formula are both on 4.2.4, and this entry tracks the
# newest tag, which is the same.
#
# Worth being clear that nothing here HOLDS it at 4. This entry follows
# whatever helm tags latest, so v5 would arrive on an ordinary update run the
# same way v4 did - quietly, on a morning when nobody changed anything. That is
# the trade the RELEASES list makes everywhere and it is fine for a personal
# machine; if helm ever needs holding, this is the line to pin.
RELEASE_helm_DESC="Kubernetes package manager"
RELEASE_helm_REPO="helm/helm"
RELEASE_helm_BIN="helm"
# helm attaches NO binaries to its GitHub releases - the tarballs live on
# get.helm.sh - so this names the whole URL. The tag still comes from the
# GitHub API, which is the part GitHub does answer for.
RELEASE_helm_URL="https://get.helm.sh/helm-{TAG}-linux-{ARCH}.tar.gz"
RELEASE_helm_ASSET=""

RELEASE_k9s_DESC="Kubernetes TUI"
RELEASE_k9s_REPO="derailed/k9s"
RELEASE_k9s_BIN="k9s"
# Capital L, and no version in the name - k9s names its assets differently from
# every other project here, which is why the pattern is per-entry.
RELEASE_k9s_ASSET="k9s_Linux_{ARCH}.tar.gz"

RELEASE_stern_DESC="Multi-pod log tailing"
RELEASE_stern_REPO="stern/stern"
RELEASE_stern_BIN="stern"
# {VERSION}, not {TAG}: the tag is v1.31.0 and the asset says 1.31.0.
RELEASE_stern_ASSET="stern_{VERSION}_linux_{ARCH}.tar.gz"

# yq, and NOT the `yq` in the Debian archive. Measured, not theorised: that
# package is kislyuk/yq 3.4.3, which Debian's own description calls a "jq
# wrapper for YAML documents" - a Python script that transcodes YAML and shells
# out to jq. This is mikefarah/yq, the Go program, which is what the Windows
# manifest installs as MikeFarah.yq and what Homebrew's `yq` formula is on
# macOS.
#
# Two unrelated projects answering to one command name, which is exactly what
# lets the mix-up survive unnoticed: a simple read is spelled the same on both,
# so `yq '.a.b' file` works either way. Everything past that diverges - `yq
# eval`, `-i` in place, `-o=json` - so a snippet that works on the other two
# platforms fails here in a way that reads like a typo rather than a different
# program. The cli group exists so muscle memory transfers between the three
# shells; an apt package answering to the right name with the wrong syntax
# defeats the whole point of having the group.
#
# The asset carries NO extension, and that is a shape unpack_asset handles on
# purpose - it copies the download to the binary name rather than guessing at
# an archive - so this entry needs nothing new from bootstrap.sh.
#
# Nothing here uninstalls, so a machine that ran an earlier manifest still has
# Debian's yq at /usr/bin/yq. That copy is shadowed rather than removed: the
# managed zsh fragment PREPENDS ~/.local/bin to PATH, so this one wins. Remove
# the apt package by hand if you would rather not have both on disk.
RELEASE_yq_DESC="YAML processor"
RELEASE_yq_REPO="mikefarah/yq"
RELEASE_yq_BIN="yq"
RELEASE_yq_ASSET="yq_linux_{ARCH}"

# Where the binaries land. Not /usr/local/bin: this needs no root, and a
# per-user directory cannot collide with anything the distribution ships.
# Debian's own ~/.profile adds this to PATH when it exists - but zsh does not
# read .profile, so the managed fragment adds it too.
RELEASE_BIN_DIR="${HOME}/.local/bin"

# ------------------------------------------------------------
# Nerd Font
# ------------------------------------------------------------
# powerlevel10k draws its prompt out of a Nerd Font's private-use area. Without
# one installed the prompt is not merely plain, it is boxes - and the Windows
# manifest has installed Meslo for exactly this reason since its first release
# while this side quietly did not.
#
# Meslo to match Windows, so a prompt looks the same on both.
#
# Only installed on a machine with a desktop, and that is not a size argument.
# The font has to be on the machine you are TYPING at, because that is where
# the glyphs get rendered. SSH into a headless Debian box from a terminal that
# already has Meslo and the prompt draws correctly with no font on the server
# at all; install one there and nothing anywhere looks different.
NERD_FONT_ENABLED=yes
NERD_FONT_NAME="Meslo"
NERD_FONT_REPO="ryanoasis/nerd-fonts"
# The face the files are named for, used to decide whether it is already here.
NERD_FONT_MATCH="MesloLGMNerdFont"
NERD_FONT_DIR="${HOME}/.local/share/fonts"

# ------------------------------------------------------------
# Terminal config
# ------------------------------------------------------------
# The reason ghostty was chosen over the alternatives: its config is a plain
# text file, so this script can manage it the same way it manages the zsh
# fragment - written, compared, and reported as `current` when nothing moved.
#
# scrollback-limit is in BYTES, and there is no unlimited setting. Ghostty says
# so itself: "It is not currently possible to set an unlimited scrollback
# buffer. This is a future planned feature."
#
# 256MB, and the number is chosen against two facts from the same docs. It is
# PER TERMINAL SURFACE, not per application - every tab and every split gets
# its own - and the buffer lives entirely in RAM. It is a cap rather than a
# preallocation, so an idle tab costs nothing, but a runaway process in a
# handful of splits can reach the whole of it. 256MB is far more than a large
# terraform plan produces and still bounded if something goes wrong.
#
# Worth being clear about what this does and does not do. Scrollback is a RAM
# buffer belonging to one window: close the window and it is gone, and it is
# never written anywhere. If the goal is "every command I ran is still there
# tomorrow", that is SHELL HISTORY, configured in the zsh section below - the
# two solve different halves and you want both.
GHOSTTY_ENABLED=yes
GHOSTTY_SCROLLBACK_BYTES=268435456

# The theme is a name ghostty already ships - `ghostty +list-themes` prints
# 463 of them - so this is a filename match, not a palette this manifest owns.
# Catppuccin Mocha is the widely used dark default across dev tooling in 2026;
# swap the name to any other row from that list to change palette without any
# other edit here. Ghostty also accepts `dark:X,light:Y` to auto-switch with
# the desktop theme - drop that form in as the value if that is wanted.
GHOSTTY_THEME="Catppuccin Mocha"

# The Meslo Nerd Font the manifest already installs, matched by its
# PostScript/family name rather than by the filename. The value here has to
# be `MesloLGM Nerd Font Mono` and not `MesloLGMNerdFont` (the ttf naming) -
# ghostty reads the installed face table, and that table names it with the
# spaces. Change this alongside NERD_FONT_MATCH above or the two disagree.
# Empty falls back to ghostty's built-in bundled font.
GHOSTTY_FONT_FAMILY="MesloLGM Nerd Font Mono"

# 16pt, matching the macOS manifest so a fleet running both feels the same
# on either side. Ghostty's default is 13pt.
GHOSTTY_FONT_SIZE=16

# Select-to-copy: highlighting text puts it on the clipboard Ctrl-V and the
# GUI paste both reach. The value has to be `clipboard` and not `true` -
# `true` copies to the X11 *primary selection*, which is a separate buffer
# and only reachable via middle-click or Ctrl-Shift-V. On Wayland the primary
# selection needs a compositor that supports it (most do) plus a wl-clipboard
# helper for CLI access. `clipboard` is the intuitive one and works the same
# on X11 and Wayland. Set to `false` to disable.
GHOSTTY_COPY_ON_SELECT=clipboard

# Ghostty auto-installs the shell hooks; this list opts INTO the extra
# behaviours those hooks provide.
#   cursor       - follows zsh vi-mode with a bar/block change.
#   sudo         - preserves TERM/TERMINFO through sudo, so colours and
#                  shell integration survive `sudo -i`.
#   title        - keeps the terminal title tracking cwd.
#   ssh-env      - carries ghostty's env (TERM=xterm-ghostty, COLORTERM=
#                  truecolor) through ssh, so the remote shell sees what
#                  the local one does. Adding this WITHOUT ssh-terminfo
#                  breaks curses apps on any host that does not already
#                  have the xterm-ghostty terminfo entry - which is most
#                  of them, so the two go together.
#   ssh-terminfo - on first ssh to a new host, pipes `infocmp -x
#                  xterm-ghostty` through `tic -x -` on the remote,
#                  installing the terminfo entry under the remote user's
#                  ~/.terminfo. Cached locally afterwards, so a repeat
#                  connection costs nothing. Requires `tic` on the remote
#                  (part of ncurses; on every Linux, macOS and BSD).
# Set to the empty string to opt out of all five and leave only the base
# hooks.
GHOSTTY_SHELL_INTEGRATION_FEATURES="cursor,sudo,title,ssh-env,ssh-terminfo"

# Quake-style drop-down terminal, summoned from anywhere with one hotkey.
# Ctrl-\` toggles it; `global:` scopes the binding to the desktop rather than
# to a ghostty window, so it works when ghostty is not focused. Ghostty relies
# on the compositor supporting global shortcuts - on Wayland this needs the
# GlobalShortcuts XDG portal to be installed (KDE and GNOME both ship it, most
# tiling WMs do not). Set to the empty string to disable the binding entirely.
GHOSTTY_QUICK_TERMINAL_KEYBIND="global:ctrl+grave_accent=toggle_quick_terminal"

# Padding between the terminal content and the window edge. Ghostty's default
# is 2/2 - visually cramped at 16pt, especially at the left edge where a bare
# `%` prompt lives right against the frame. 10/10 gives it room to breathe.
GHOSTTY_WINDOW_PADDING_X=10
GHOSTTY_WINDOW_PADDING_Y=10

# ------------------------------------------------------------
# Shell history
# ------------------------------------------------------------
# This is the half that actually persists. zsh's own defaults are small and
# lossy, and oh-my-zsh only nudges them - so without this a busy week silently
# drops the command you wanted.
#
# HISTSIZE is what the running shell keeps in memory; SAVEHIST is what reaches
# the file. SAVEHIST must not be smaller than HISTSIZE or the file is truncated
# on every exit, which is the classic way to lose history while believing it is
# being kept.
HISTORY_SIZE=1000000
HISTORY_FILE_SIZE=1000000

# ------------------------------------------------------------
# Schedule
# ------------------------------------------------------------
# Consumed by the schedule phase: a systemd timer that re-runs this same
# script unattended, so updates arrive without anyone remembering to ask for
# them - the Linux side of the same job the Windows manifest's Schedule block
# gives Task Scheduler.
#
# A SYSTEM timer (root), not a user one: apt needs root, and a --user timer
# only runs while that user has an active login session - exactly the case a
# machine is least likely to be in overnight, which is when this is meant to
# fire.
#
# Enabled=no leaves systemd completely alone; the phase then reports what it
# would have registered and does nothing. --skip-schedule does the same for
# one run.
SCHEDULE_ENABLED=yes
SCHEDULE_UNIT_NAME="bootstrap-linux"

# 24-hour HH:MM, turned into a systemd OnCalendar expression. Not on the hour
# and not at a time the machine is likely mid-something - a run landing while
# you are at the keyboard pops apt/flatpak output into a session you're using.
SCHEDULE_TIME="04:20"

# ------------------------------------------------------------
# Held
# ------------------------------------------------------------
# Neither installed nor upgraded; reported as `held` so it stays visible rather
# than quietly absent. Format: "package:reason".
HELD=()

# ------------------------------------------------------------
# Third-party apt repositories
# ------------------------------------------------------------
# Software that is not in the distribution archive and ships its own repository
# instead. bootstrap.sh fetches the signing key into /etc/apt/keyrings, writes
# a deb822 .sources file that is scoped to that one key, and then installs the
# packages like any other.
#
# Understand what this is before adding to it: a repository here can push a
# package to this machine on every future update run, forever. That is why each
# entry names its key URL explicitly rather than piping a vendor script into a
# shell, why the key is scoped with Signed-By to its own repository rather than
# trusted globally, and why apt-key - which trusts a key for EVERY repository
# on the system - is not used anywhere.
#
# REPO_<name>_GUI=yes marks one that only makes sense with a desktop, and it is
# skipped on a headless machine exactly like a GUI package group.
REPOS=(vscode docker unityhub kubernetes azurecli gcloud)

REPO_vscode_DESC="Visual Studio Code"
REPO_vscode_GUI=yes
REPO_vscode_KEY_URL="https://packages.microsoft.com/keys/microsoft.asc"
REPO_vscode_URI="https://packages.microsoft.com/repos/code"
REPO_vscode_SUITES="stable"
REPO_vscode_COMPONENTS="main"
REPO_vscode_PACKAGES=(code)

REPO_docker_DESC="Docker Engine"
REPO_docker_GUI=no
# {ID} and {CODENAME} are substituted from /etc/os-release: Docker publishes a
# separate tree per distribution and per release, and pointing Ubuntu at the
# Debian one installs packages built against the wrong libc.
REPO_docker_KEY_URL="https://download.docker.com/linux/{ID}/gpg"
REPO_docker_URI="https://download.docker.com/linux/{ID}"
REPO_docker_SUITES="{CODENAME}"
REPO_docker_COMPONENTS="stable"
REPO_docker_PACKAGES=(docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin)

REPO_unityhub_DESC="Unity Hub"
REPO_unityhub_GUI=yes
REPO_unityhub_KEY_URL="https://hub.unity3d.com/linux/keys/public"
REPO_unityhub_URI="https://hub.unity3d.com/linux/repos/deb"
REPO_unityhub_SUITES="stable"
REPO_unityhub_COMPONENTS="main"
REPO_unityhub_PACKAGES=(unityhub)

REPO_kubernetes_DESC="kubectl"
REPO_kubernetes_GUI=no
# A FLAT repository: the whole archive sits at one path, so Suites is "/" and
# there are no components at all. Leaving COMPONENTS empty is how this manifest
# says that - bootstrap.sh then omits the field rather than writing an empty
# one, which apt rejects.
#
# The Kubernetes MINOR VERSION is part of both URLs, and that is deliberate on
# their end: each minor has its own repository and they do not roll you forward
# across one. So this is a pin whether you treat it as one or not - bump it
# consciously, and check the cluster you talk to first, because kubectl is only
# supported within one minor of the API server.
REPO_kubernetes_KEY_URL="https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key"
REPO_kubernetes_URI="https://pkgs.k8s.io/core:/stable:/v1.37/deb/"
REPO_kubernetes_SUITES="/"
REPO_kubernetes_COMPONENTS=""
REPO_kubernetes_PACKAGES=(kubectl)

REPO_azurecli_DESC="Azure CLI"
REPO_azurecli_GUI=no
# The same Microsoft key the vscode entry above already trusts, which is worth
# noticing: this adds a repository but not a new signing authority.
REPO_azurecli_KEY_URL="https://packages.microsoft.com/keys/microsoft.asc"
REPO_azurecli_URI="https://packages.microsoft.com/repos/azure-cli/"
REPO_azurecli_SUITES="{CODENAME}"
REPO_azurecli_COMPONENTS="main"
REPO_azurecli_PACKAGES=(azure-cli)

REPO_gcloud_DESC="Google Cloud CLI"
REPO_gcloud_GUI=no
# Package is google-cloud-cli, not google-cloud-sdk - Google renamed it, and
# the old name still resolves to a transitional package on some mirrors, which
# is the kind of thing that installs and then puzzles you later.
REPO_gcloud_KEY_URL="https://packages.cloud.google.com/apt/doc/apt-key.gpg"
REPO_gcloud_URI="https://packages.cloud.google.com/apt"
REPO_gcloud_SUITES="cloud-sdk"
REPO_gcloud_COMPONENTS="main"
REPO_gcloud_PACKAGES=(google-cloud-cli)

# ------------------------------------------------------------
# Manual
# ------------------------------------------------------------
# Still detected and reported, never installed - for anything that has no
# repository worth adding. Format is "command:name:where-to-get-it".
MANUAL=()
