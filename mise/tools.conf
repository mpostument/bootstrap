# Global runtime versions, one `tool@version` per line, shared by all three
# platforms.
#
# Applied with `mise use -g`, which merges into the user's global
# ~/.config/mise/config.toml instead of replacing it - a tool added by hand
# survives the next bootstrap run. Comments and blank lines are ignored.
#
# macOS note: a mise JDK is not registered with /usr/libexec/java_home, so the
# JetBrains IDEs, Android Studio and anything else that auto-detects a JDK will
# not find it - point them at the path once:
#
#     ~/.local/share/mise/installs/java/temurin-21
#
# That symlink is maintained by mise and follows patch bumps, so it is a
# one-time setup. Shells are fine either way: `mise activate` exports
# JAVA_HOME, and on Windows the bootstrap writes it persistently.
#
# Python is deliberately absent: the system python3 is what OS packages link
# against, and mise shadowing it breaks them. Per-project versions belong in a
# project's own mise.toml, not here.
node@lts
go@latest
java@temurin-21
