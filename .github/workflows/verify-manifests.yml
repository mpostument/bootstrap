name: Verify manifests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: The cli group is the same on all three platforms
        run: bash tools/parity.sh

      - name: Every apt package exists on each release the script runs on
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . linux/packages.conf
          pkgs=()
          for g in "${PKG_GROUPS[@]}"; do
            declare -n _apt="GROUP_${g}_APT"
            pkgs+=("${_apt[@]}")
            unset -n _apt
          done
          printf '%s\n' "${pkgs[@]}" | sort -u > /tmp/apt-wanted.txt

          # Every release a machine runs, not only the newest: checking trixie
          # alone never saw that bookworm has no openjdk-21-jdk.
          known_absent=" "

          failed=0
          for image in debian:bookworm-slim debian:trixie-slim ubuntu:24.04; do
            echo "Checking $(wc -l < /tmp/apt-wanted.txt) apt package names against $image"
            missing="$(docker run --rm -v /tmp/apt-wanted.txt:/wanted.txt "$image" sh -c '
              apt-get update -qq >/dev/null 2>&1
              while read -r p; do
                [ -z "$p" ] && continue
                apt-cache show "$p" >/dev/null 2>&1 || printf "%s " "$p"
              done < /wanted.txt
            ')"
            for p in $missing; do
              if printf '%s' "$known_absent" | grep -q " $p "; then
                echo "NOTE $p - not on $image, and the manifest says so"
              else
                echo "::error file=linux/packages.conf::apt package '$p' is not on $image"
                failed=1
              fi
            done
          done
          [ "$failed" -eq 0 ] && echo 'OK   every apt package resolves on every release'
          exit "$failed"

      - name: Every third-party repository serves each release and architecture
        run: bash tools/verify-repos.sh

      - name: Every Flathub reference exists
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . linux/packages.conf
          failed=0
          n=0
          for g in "${PKG_GROUPS[@]}"; do
            declare -n _flat="GROUP_${g}_FLATPAK"
            for ref in ${_flat[@]+"${_flat[@]}"}; do
              n=$(( n + 1 ))
              if curl -fsSL -o /dev/null "https://flathub.org/api/v2/appstream/${ref}"; then
                echo "OK   $ref"
                arches="$(curl -fsSL "https://flathub.org/api/v2/summary/${ref}" | grep -o '"arches":\[[^]]*\]' | head -1 || true)"
                case "$arches" in
                  ''|*aarch64*) ;;
                  *) echo "NOTE $ref - no aarch64 build; bootstrap.sh reports it missing on arm64" ;;
                esac
              else
                echo "::error file=linux/packages.conf::'$ref' is not on Flathub - check the reverse-DNS spelling, it is case sensitive"
                failed=1
              fi
            done
            unset -n _flat
          done
          [ "$failed" -eq 0 ] && echo "OK   all $n Flathub references resolve"
          exit "$failed"

      - name: Every Homebrew formula and cask exists
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . macos/packages.conf

          curl -fsSL https://formulae.brew.sh/api/formula.json -o /tmp/f.json
          curl -fsSL https://formulae.brew.sh/api/cask.json    -o /tmp/c.json

          { grep -o '"name":"[^"]*"' /tmp/f.json | cut -d'"' -f4
            grep -o '"aliases":\[[^]]*\]' /tmp/f.json | grep -o '"[^"]*"' | tr -d '"'
          } | sort -u > /tmp/formulae.txt
          { grep -o '"token":"[^"]*"' /tmp/c.json | cut -d'"' -f4
          } | sort -u > /tmp/casks.txt
          grep -o '"old_tokens":\[[^]]*\]' /tmp/c.json | grep -o '"[^"]*"' | tr -d '"' \
            | sort -u > /tmp/casks-old.txt

          echo "index: $(wc -l < /tmp/formulae.txt) formulae, $(wc -l < /tmp/casks.txt) casks"

          check() {
            local kind="$1" name="$2"
            case "$kind" in
              formula) grep -qxF "$name" /tmp/formulae.txt ;;
              cask)    grep -qxF "$name" /tmp/casks.txt ;;
            esac
          }

          failed=0
          n=0
          for g in "${PKG_GROUPS[@]}"; do
            declare -n _form="GROUP_${g}_FORMULA"
            declare -n _cask="GROUP_${g}_CASK"
            for f in ${_form[@]+"${_form[@]}"}; do
              n=$(( n + 1 ))
              case " tflint " in *" $f "*) echo "NOTE $f - from a tap, not core"; continue ;; esac
              check formula "$f" || {
                echo "::error file=macos/packages.conf::'$f' is not a Homebrew formula (is it a cask, or does it need a tap in TAPS?)"
                failed=1
              }
            done
            for c in ${_cask[@]+"${_cask[@]}"}; do
              n=$(( n + 1 ))
              if ! check cask "$c"; then
                if grep -qxF "$c" /tmp/casks-old.txt; then
                  echo "::error file=macos/packages.conf::cask '$c' was RENAMED - it survives only as an old_token. Find the new name in https://formulae.brew.sh/api/cask.json"
                else
                  echo "::error file=macos/packages.conf::'$c' is not a Homebrew cask (is it a formula, or from a tap?)"
                fi
                failed=1
              fi
            done
            unset -n _form _cask
          done
          [ "$failed" -eq 0 ] && echo "OK   all $n Homebrew names resolve, each as the kind the manifest says"
          exit "$failed"

      - name: Every winget id exists in winget-pkgs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids="$(pwsh -NoProfile -Command "
            \$m = Import-PowerShellDataFile 'windows/packages.psd1'
            \$m.Groups | ForEach-Object { \$_.Packages }
          " | tr -d '\r' | sed '/^[[:space:]]*$/d')"

          failed=0
          n=0
          while read -r id; do
            [ -z "$id" ] && continue
            n=$(( n + 1 ))
            first="$(printf '%s' "${id%%.*}" | cut -c1 | tr '[:upper:]' '[:lower:]')"
            path="manifests/${first}/$(printf '%s' "$id" | tr '.' '/')"
            if ! gh api "repos/microsoft/winget-pkgs/contents/${path}" --silent 2>/dev/null; then
              echo "::error file=windows/packages.psd1::winget id '$id' has no manifest at ${path} - check spelling and CASE, winget is invoked with -e"
              failed=1
            fi
          done <<< "$ids"
          [ "$failed" -eq 0 ] && echo "OK   all $n winget ids resolve, case included"
          exit "$failed"

      - name: Every RELEASES asset URL resolves
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . linux/packages.conf

          failed=0
          for name in "${RELEASES[@]}"; do
            repo_var="RELEASE_${name}_REPO"; url_var="RELEASE_${name}_URL"
            repo="${!repo_var}"; url_tpl="${!url_var:-}"

            prefix_var="RELEASE_${name}_TAG_PREFIX"; prefix="${!prefix_var:-}"
            if [ -z "$prefix" ]; then
              tag="$(curl -fsSL "https://api.github.com/repos/${repo}/releases/latest" \
                     | sed -n 's/.*"tag_name" *: *"\([^"]*\)".*/\1/p' | head -1 || true)"
            else
              # one repository, several products: the newest tag with the prefix
              tag="$(curl -fsSL "https://api.github.com/repos/${repo}/releases?per_page=50" \
                     | sed -n 's/.*"tag_name" *: *"\([^"]*\)".*/\1/p' \
                     | grep -m1 -E "^${prefix}[0-9]+(\.[0-9]+)*\$" || true)"
            fi
            if [ -z "$tag" ]; then
              echo "::warning::could not read a latest tag for ${repo} - rate limited?"
              continue
            fi
            version="${tag#v}"
            # jq-1.8.2, gping-v1.21.0: read the number out, as install_release does
            case "$version" in [0-9]*) ;; *) version="$(printf '%s' "$tag" | grep -oE '[0-9]+(\.[0-9]+)+' | head -1)" ;; esac

            # Both architectures the script installs for, as dpkg, uname and
            # goreleaser spell them. x86_64 alone missed starship's arm64 404.
            for spelling in "amd64 x86_64 x86_64" "arm64 aarch64 arm64"; do
              read -r deb uname gorel <<< "$spelling"
              arch_asset_var="RELEASE_${name}_ASSET_${deb}"; asset_var="RELEASE_${name}_ASSET"
              asset="${!arch_asset_var:-${!asset_var:-}}"

              url="$url_tpl"
              [ -z "$url" ] && url="https://github.com/${repo}/releases/download/${tag}/${asset}"
              url="${url//\{ARCH\}/$deb}"
              url="${url//\{UNAME_ARCH\}/$uname}"
              url="${url//\{GORELEASER_ARCH\}/$gorel}"
              url="${url//\{TAG\}/$tag}"
              url="${url//\{VERSION\}/$version}"

              code="$(curl -o /dev/null -sIL -w '%{http_code}' "$url")"
              if [ "$code" = "200" ]; then
                echo "OK   $name $tag $deb"
              else
                echo "::error file=linux/packages.conf::$name ($deb): HTTP $code for $url - the asset naming has probably changed"
                failed=1
              fi
            done
          done
          exit "$failed"
