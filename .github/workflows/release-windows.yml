name: Release Windows bootstrap

# Each platform in this repository is released on its own, so the tag carries a
# platform prefix - windows-vX.Y.Z rather than a bare vX.Y.Z, which would imply
# the whole repository had been cut at once.
#
# To publish:
#   1. bump $script:BootstrapVersion in windows/bootstrap.ps1
#   2. add the matching section to windows/CHANGELOG.md
#   3. commit, then: git tag windows-v1.2.3 && git push origin windows-v1.2.3
#
# Every one of those three is checked below before anything is published, so a
# half-done release fails the job instead of shipping.
on:
  push:
    tags:
      - "windows-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The tag is the request; bootstrap.ps1 is the source of truth. If they
      # disagree, someone tagged without bumping (or bumped without tagging),
      # and a downloaded copy would report a version that does not match the
      # release it came from. Fail rather than publish that.
      - name: Check the tag matches the version in the script
        id: version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#windows-v}"
          FILE_VERSION="$(grep -m1 '^\$script:BootstrapVersion' windows/bootstrap.ps1 | cut -d"'" -f2)"

          if [ -z "$FILE_VERSION" ]; then
            echo "::error::Could not find \$script:BootstrapVersion in windows/bootstrap.ps1."
            echo "::error::The release workflow parses that exact line - check its shape."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag says $TAG_VERSION, windows/bootstrap.ps1 says $FILE_VERSION."
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG_VERSION"

      # Release notes come from the changelog, so an unreleased version with no
      # entry would publish with an empty body. Cheaper to catch here.
      - name: Extract release notes from the changelog
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="[$VERSION]" '
            index($0, "## " v) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' windows/CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No '## [$VERSION]' section in windows/CHANGELOG.md."
            exit 1
          fi
          cat release-notes.md

      # pwsh is preinstalled on the Ubuntu runners, so the released scripts can
      # be parsed before they are published. This is not a substitute for
      # running them - that needs Windows and winget - but it does mean a file
      # with a syntax error can never reach a release asset.
      - name: Validate the PowerShell that is about to ship
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem windows/*.ps1) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$errors)
              if ($errors.Count) {
                  $failed = $true
                  foreach ($e in $errors) {
                      Write-Host "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                  }
              } else {
                  Write-Host "OK   $($file.Name)"
              }
          }
          # Import-PowerShellDataFile evaluates nothing, so this proves the
          # manifest parses without running anything out of it.
          $m = Import-PowerShellDataFile windows/packages.psd1
          # Parsing is not completeness. Drop a whole top-level section and the
          # import still succeeds - 1.3.0 shipped without Shell exactly that
          # way, and the failure surfaced at runtime as a StrictMode property
          # error naming the consuming line rather than the manifest.
          $required = @('Groups', 'Pins', 'Managed', 'Shell', 'Mpv', 'Schedule')
          $absent = @($required | Where-Object { -not $m.Contains($_) })
          if ($absent.Count) {
              $failed = $true
              Write-Host "::error file=windows/packages.psd1::Missing section(s): $($absent -join ', ')"
          }
          $count = ($m.Groups | ForEach-Object { $_.Packages.Count } | Measure-Object -Sum).Sum
          Write-Host "OK   packages.psd1 - $($m.Groups.Count) groups, $count packages, sections: $(@($m.Keys) -join ', ')"
          if ($failed) { exit 1 }

      # 1.0.2 shipped with `$script:Root` holding the tool's own directory and,
      # 300 lines later, `foreach ($root in $uninstallRoots)`. Those are the
      # SAME variable - PowerShell names are case-insensitive and an unscoped
      # assignment writes to the enclosing scope - so an unrelated loop pointed
      # the tool at a registry hive and the run died complaining about an
      # unrelated parameter on an unrelated line.
      #
      # Nothing catches that by reading: it parses, and both halves look
      # correct in isolation. So check it mechanically instead.
      - name: Check no loop variable shadows a script-scoped variable
        shell: pwsh
        run: |
          $bad = $false
          foreach ($file in Get-ChildItem windows/*.ps1) {
              $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$null, [ref]$null)

              $scoped = $ast.FindAll({
                      param($n)
                      $n -is [System.Management.Automation.Language.VariableExpressionAst] -and
                      $n.VariablePath.IsScript
                  }, $true) |
                  ForEach-Object { $_.VariablePath.UserPath -replace '^(?i)script:', '' } |
                  Sort-Object -Unique

              $ast.FindAll({
                      param($n)
                      $n -is [System.Management.Automation.Language.ForEachStatementAst]
                  }, $true) | ForEach-Object {
                  $name = $_.Variable.VariablePath.UserPath
                  if ($scoped -contains $name) {
                      $bad = $true
                      Write-Host "::error file=$($file.FullName),line=$($_.Extent.StartLineNumber)::foreach variable `$$name shadows script-scoped `$script:$name - rename one of them"
                  }
              }
          }
          if ($bad) { exit 1 }
          Write-Host 'OK   no loop variable shadows a script-scoped variable'

      # Parsing is not enough: 1.0.1 parsed perfectly and still could not start.
      # $PSScriptRoot is empty while parameter defaults are evaluated when an
      # advanced script is launched with `-File`, so the script threw before its
      # first line - and only under `-File`, which is the invocation the README
      # recommends for a downloaded copy but nothing here had ever exercised.
      #
      # -ShowVersion returns before any Windows-only code, so this runs on the
      # Linux runner and still proves the script can actually START.
      - name: Check the script can be launched with -File
        run: |
          set -euo pipefail
          ACTUAL="$(pwsh -File windows/bootstrap.ps1 -ShowVersion | tr -d '[:space:]')"
          EXPECTED="${{ steps.version.outputs.version }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::pwsh -File bootstrap.ps1 -ShowVersion printed '$ACTUAL', expected '$EXPECTED'."
            exit 1
          fi
          echo "OK   pwsh -File bootstrap.ps1 -ShowVersion -> $ACTUAL"

      # windows/ ONLY. A release asset should carry what you need to run the
      # thing and nothing else, so someone unpacking it on a fresh machine is
      # not handed other platforms' files to wonder about. GitHub attaches its
      # own "Source code" archives to every release, which do contain the whole
      # tree, for anyone who wants it.
      - name: Build the release archive
        id: archive
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="bootstrap-windows-v$VERSION"

          mkdir -p "$STAGE"
          cp windows/bootstrap.ps1 \
             windows/packages.psd1 \
             windows/profile.ps1 \
             windows/merge-terminal-settings.ps1 \
             windows/README.md \
             windows/CHANGELOG.md \
             "$STAGE/"

          # -r, and a separate line from the cp above: windows/mpv is a
          # DIRECTORY, and it now holds a script-opts/ subdirectory of its
          # own. It was missing from the archive entirely in 1.1.0, the
          # release that introduced the mpv phase - so a downloaded copy on
          # a machine with mpv installed died at Copy-Item with no source
          # file. Nothing caught it because every test run was from a git
          # checkout, where the directory is simply always there.
          cp -r windows/mpv "$STAGE/"

          zip -r "$STAGE.zip" "$STAGE"
          sha256sum "$STAGE.zip" | tee "$STAGE.zip.sha256"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE="${{ steps.archive.outputs.stage }}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Windows bootstrap v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            "$STAGE.zip" \
            "$STAGE.zip.sha256"
